    <script>
        // Tạo không gian tên dữ liệu độc lập cho game chính
        (function () {
            const GAME_PREFIX = 'game_';
            const GAME_DB_NAME = 'game_acjt_dlc_db';
            const GAME_VECTOR_DB_NAME = 'game_Vectoracjt';

            // Bọc localStorage, tự động thêm tiền tố game_
            const originalLocalStorage = {
                getItem: localStorage.getItem.bind(localStorage),
                setItem: localStorage.setItem.bind(localStorage),
                removeItem: localStorage.removeItem.bind(localStorage),
                clear: localStorage.clear.bind(localStorage)
            };

            // Ghi đè các phương thức localStorage
            Storage.prototype.getItem = function (key) {
                return originalLocalStorage.getItem(GAME_PREFIX + key);
            };

            Storage.prototype.setItem = function (key, value) {
                return originalLocalStorage.setItem(GAME_PREFIX + key, value);
            };

            Storage.prototype.removeItem = function (key) {
                return originalLocalStorage.removeItem(GAME_PREFIX + key);
            };

            // Phương thức clear chỉ xóa dữ liệu có tiền tố game_
            Storage.prototype.clear = function () {
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith(GAME_PREFIX)) {
                        keysToRemove.push(key);
                    }
                }
                keysToRemove.forEach(key => originalLocalStorage.removeItem(key));
            };

            // Lưu cấu hình để DLCManager sử dụng
            window.GAME_CONFIG = {
                DB_NAME: GAME_DB_NAME,
                VECTOR_DB_NAME: GAME_VECTOR_DB_NAME
            };

            console.log('[Game chính] Đã bật cách ly dữ liệu - Tiền tố localStorage:', GAME_PREFIX);
            console.log('[Game chính] Tên database DLC:', GAME_DB_NAME);
        })();
    </script>

    <script>
        // Tải popup cấu hình sau khi trang load xong
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                loadConfigModal();
                // Khởi tạo biểu đồ nhân vật
                setTimeout(initCharacterGraphSystem, 1500);
            });
        } else {
            loadConfigModal();
            // Khởi tạo biểu đồ nhân vật
            setTimeout(initCharacterGraphSystem, 1500);
        }

        // Khởi tạo hệ thống biểu đồ nhân vật
        async function initCharacterGraphSystem() {
            try {
                console.log('[Biểu đồ nhân vật] Bắt đầu khởi tạo hệ thống...');

                // 🔧 Đợi tất cả module load xong
                let retryCount = 0;
                const maxRetries = 30; // 3 giây, kiểm tra mỗi 100ms

                while ((!window.characterGraphManager || !window.characterGraphIntegration || !window.initializeCharacterGraphHooks) && retryCount < maxRetries) {
                    console.log(`[Biểu đồ nhân vật] ⏳ Đang đợi tất cả module load... (${retryCount + 1}/${maxRetries})`);
                    await new Promise(resolve => setTimeout(resolve, 100));
                    retryCount++;
                }

                // Kiểm tra xem các module đã khả dụng chưa
                if (!window.characterGraphManager) {
                    console.error('[Biểu đồ nhân vật] ❌ Không tìm thấy CharacterGraphManager');
                    return;
                }
                if (!window.characterGraphIntegration) {
                    console.error('[Biểu đồ nhân vật] ❌ Không tìm thấy CharacterGraphIntegration');
                    return;
                }
                if (!window.initializeCharacterGraphHooks) {
                    console.error('[Biểu đồ nhân vật] ❌ Không tìm thấy CharacterGraphHooks');
                    return;
                }

                // Khởi tạo theo thứ tự
                console.log('[Biểu đồ nhân vật] 🔄 Khởi tạo trình quản lý...');
                await window.characterGraphManager.init();
                console.log('✅ Khởi tạo trình quản lý biểu đồ nhân vật thành công');

                console.log('[Biểu đồ nhân vật] 🔄 Khởi tạo tích hợp...');
                await window.characterGraphIntegration.init();
                console.log('✅ Khởi tạo tích hợp biểu đồ nhân vật thành công');

                console.log('[Biểu đồ nhân vật] 🔄 Khởi tạo hook...');
                window.initializeCharacterGraphHooks();
                console.log('✅ Khởi tạo hook biểu đồ nhân vật thành công');

                console.log('[Biểu đồ nhân vật] ✅ Hệ thống khởi tạo thành công');
            } catch (error) {
                console.error('[Biểu đồ nhân vật] ❌ Khởi tạo thất bại:', error);
            }
        }

        // Hàm toàn cục: Chuyển đổi tab trên mobile
        function switchMobileTab(tabName) {
            console.log('[Tab Mobile] Chuyển đến:', tabName);

            try {
                // Xóa tất cả class active
                const tabBtns = document.querySelectorAll('.tab-btn');
                console.log('[Tab Mobile] Số nút tab tìm thấy:', tabBtns.length);
                tabBtns.forEach(btn => {
                    btn.classList.remove('active');
                });

                const gamePanel = document.querySelector('.game-panel');
                const statusPanel = document.querySelector('.status-panel');
                console.log('[Tab Mobile] Panel tìm thấy:', {
                    gamePanel: !!gamePanel,
                    statusPanel: !!statusPanel
                });

                if (gamePanel) gamePanel.classList.remove('active');
                if (statusPanel) statusPanel.classList.remove('active');

                // Thêm class active tương ứng
                const targetTab = document.querySelector(`[data-tab="${tabName}"]`);
                console.log('[Tab Mobile] Tab mục tiêu:', !!targetTab);
                if (targetTab) {
                    targetTab.classList.add('active');
                }

                if (tabName === 'game') {
                    if (gamePanel) {
                        gamePanel.classList.add('active');
                        console.log('[Tab Mobile] Đã kích hoạt panel game');
                    }
                } else if (tabName === 'status') {
                    if (statusPanel) {
                        statusPanel.classList.add('active');
                        console.log('[Tab Mobile] Đã kích hoạt panel trạng thái');
                    }
                }
            } catch (error) {
                console.error('[Tab Mobile] Chuyển đổi thất bại:', error);
            }
        }
    </script>

    <script type="module" id="transformersScript">
        // Load động để tránh ảnh hưởng tốc độ load trang
        // Công tắc log debug (Mặc định tắt). Nếu cần xem log chi tiết, có thể chạy trên console: window.DEBUG_TRANSFORMERS = true
        window.DEBUG_TRANSFORMERS = (typeof window.DEBUG_TRANSFORMERS !== 'undefined') ? window.DEBUG_TRANSFORMERS : false;
        // 🆕 Thêm interceptor fetch toàn cục để theo dõi tiến độ tải model
        window._setupProgressTracking = function () {
            if (window._progressTrackingSetup) return;
            window._progressTrackingSetup = true;

            const originalFetch = window.fetch;
            window.fetch = async function (...args) {
                const [url] = args;

                // Chỉ chặn việc tải file model (.onnx, .json v.v.)
                const isModelFile = typeof url === 'string' &&
                    (url.includes('onnx') || url.includes('Xenova') || url.includes('tokenizer'));

                if (!isModelFile || !window._modelLoadProgress) {
                    return originalFetch.apply(this, args);
                }

                console.log(`[Tải model] Bắt đầu tải: ${url.split('/').pop()}`);

                const response = await originalFetch.apply(this, args);

                if (!response.ok) {
                    console.error(`[Tải model] Tải thất bại: ${response.status} ${response.statusText}`);
                    return response;
                }

                const reader = response.body.getReader();
                const contentLength = +response.headers.get('Content-Length') || 0;
                const fileName = url.split('/').pop();

                console.log(`[Tải model] ${fileName} - Kích thước: ${(contentLength / 1024 / 1024).toFixed(2)} MB`);

                let receivedLength = 0;
                const chunks = [];

                while (true) {
                    const { done, value } = await reader.read();

                    if (done) break;

                    chunks.push(value);
                    receivedLength += value.length;

                    // Cập nhật tiến độ tổng
                    if (window._modelLoadProgress) {
                        window._modelLoadProgress.files.set(fileName, {
                            loaded: receivedLength,
                            total: contentLength
                        });

                        // Tính toán tổng tiến độ
                        let totalLoaded = 0;
                        let totalSize = 0;
                        window._modelLoadProgress.files.forEach(file => {
                            totalLoaded += file.loaded;
                            totalSize += file.total;
                        });

                        window._modelLoadProgress.loaded = totalLoaded;
                        window._modelLoadProgress.total = totalSize || 15000000; // Mặc định 15MB

                        // Cập nhật UI
                        window._updateProgressUI && window._updateProgressUI();
                    }
                }

                console.log(`[Tải model] ✅ ${fileName} Đã tải xong`);

                // Lắp ráp lại response
                const chunksAll = new Uint8Array(receivedLength);
                let position = 0;
                for (let chunk of chunks) {
                    chunksAll.set(chunk, position);
                    position += chunk.length;
                }

                return new Response(chunksAll, {
                    status: response.status,
                    statusText: response.statusText,
                    headers: response.headers
                });
            };
        };

            if (window.transformersLoaded) return;

        async function startNewGame() {
            // 🎮 Chế độ game thẻ bài ACJT - Dùng luồng tạo nhân vật mới
            if (typeof ACJTGame !== 'undefined' && ACJTGame.showCharacterCreation) {
                console.log('[ACJT] Khởi động chế độ game thẻ bài - Game mới');
                // 🔧 Xóa sạch tất cả cache localStorage liên quan đến ACJT
                localStorage.removeItem('acjt_card_deck');
                localStorage.removeItem('acjt_player_state');
                localStorage.removeItem('acjt_special_status');

                // 🔧 Xóa sạch object trạng thái trong bộ nhớ của SpecialStatusManager (Sửa lỗi kế thừa trạng thái cũ khi tạo game mới)
                if (typeof SpecialStatusManager !== 'undefined') {
                    SpecialStatusManager.clearAll();
                    console.log('[ACJT] ✅ Đã xóa sạch SpecialStatusManager');
                }

                if (typeof CardDeckManager !== 'undefined') {
                    CardDeckManager.deck = [];
                }

                // 🔧 Dọn dẹp trước thư viện vector và ma trận (Không chờ ACJTGame.startGame)
                if (window.contextVectorManager) {
                    window.contextVectorManager.clear();
                    window.contextVectorManager.saveToIndexedDB().catch(err =>
                        console.error('[ACJT] Xóa sạch thư viện vector thất bại:', err));
                    console.log('[ACJT] ✅ Đã dọn dẹp trước contextVectorManager');

                }

        /**
         * 🆕 Trích xuất và thêm history vào ma trận
         * @param {string} variableUpdate - Chuỗi variableUpdate
         * @param {number} turnIndex - Chỉ số lượt
         */
        async function extractAndAddHistoryToMatrix(variableUpdate, turnIndex) {
            if (!window.contextVectorManager || !window.matrixManager) {
                return;
            }

            try {
                // Trích xuất history từ variableUpdate
                const historyItems = [];

                // Khớp định dạng >>history: văn bản
                const singleHistoryRegex = />>history:\s*(.+)/g;
                let match;
                while ((match = singleHistoryRegex.exec(variableUpdate)) !== null) {
                    historyItems.push(match[1].trim());
                }

                // Khớp định dạng history:\n  - văn bản (Hỗ trợ nhiều dòng)
                const historyBlockMatch = variableUpdate.match(/history:\s*\n([\s\S]*?)(?=\n[^\s-]|\n*$)/);
                if (historyBlockMatch) {
                    const historyBlock = historyBlockMatch[1];
                    const listItemRegex = /^\s*-\s*(.+)$/gm;
                    while ((match = listItemRegex.exec(historyBlock)) !== null) {
                        historyItems.push(match[1].trim());
                    }
                }

                if (historyItems.length === 0) {
                    console.log('[Ma trận History] Không tìm thấy trường history trong lượt này');
                    return;
                }

                console.log(`[Ma trận History] 📥 Đã trích xuất được ${historyItems.length} history`);

                // 🔧 Đồng bộ hóa với gameState.variables.history (Sửa lỗi bảng trạng thái không đồng bộ)
                if (!gameState.variables.history) {
                    gameState.variables.history = [];
                }
                for (const historyText of historyItems) {
                    // Kiểm tra trùng lặp
                    if (!gameState.variables.history.includes(historyText)) {
                        gameState.variables.history.push(historyText);
                        console.log(`[Đồng bộ History] ✅ Đã thêm vào gameState.variables.history: ${historyText.substring(0, 40)}...`);
                    }
                }

                // Thêm vào ma trận
                for (const historyText of historyItems) {
                    await window.contextVectorManager.addHistoryEntry(
                        historyText,
                        turnIndex,
                        gameState.variables
                    );
                }

                console.log(`[Ma trận History] ✅ Đã thêm ${historyItems.length} history vào ma trận`);

                // 🔧 Cập nhật panel trạng thái để hiển thị history mới
                if (typeof updateStatusPanel === 'function') {
                    updateStatusPanel();
                }
            } catch (error) {
                console.error('[Ma trận History] ❌ Lỗi khi thêm:', error);
            }
        }

        // 🆕 Thử lại việc cập nhật biến bất đồng bộ (Không tạo lại nội dung cốt truyện)
        async function retryAsyncVariableUpdate() {
            if (!window.lastAsyncVariableParams) {
                console.warn('[Thử lại biến bất đồng bộ] ❌ Không có tham số để thử lại');
                return;
            }

            const { storyText, response, turnIndex } = window.lastAsyncVariableParams;
            console.log('[Thử lại biến bất đồng bộ] 🔄 Bắt đầu thử lại, turnIndex:', turnIndex);

            const asyncIndicator = document.getElementById('asyncVariableIndicator');
            if (asyncIndicator) {
                asyncIndicator.innerHTML = `
                    <span style="display: inline-block; animation: spin 1s linear infinite;">🔄</span>
                    <span>Đang thử lại việc cập nhật biến...</span>
                `;
                asyncIndicator.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                asyncIndicator.style.display = 'flex';
            }

            try {
                const result = await processAsyncVariableUpdate(storyText, response, turnIndex);

                if (asyncIndicator) {
                    if (result) {
                        asyncIndicator.innerHTML = `<span>✅</span><span>Cập nhật biến hoàn tất</span>`;
                        asyncIndicator.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';
                        setTimeout(() => { asyncIndicator.style.display = 'none'; }, 2000);
                        saveGameHistory().catch(err => console.error('[Lưu trữ] Lỗi khi lưu:', err));
                        console.log('[Thử lại biến bất đồng bộ] ✅ Thử lại thành công');
                    } else {
                        asyncIndicator.innerHTML = `
                            <span>⚠️</span><span>Thử lại thất bại</span>
                            <button onclick="retryAsyncVariableUpdate()" style="margin-left:10px;padding:4px 12px;background:white;color:#dc3545;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:bold;">🔄 Thử lại</button>
                            <button onclick="document.getElementById('asyncVariableIndicator').style.display='none'" style="margin-left:5px;padding:4px 8px;background:transparent;color:white;border:1px solid white;border-radius:5px;cursor:pointer;font-size:12px;">✕</button>
                        `;
                        asyncIndicator.style.background = 'linear-gradient(135deg, #dc3545 0%, #fd7e14 100%)';
                    }
                }
            } catch (err) {

                        <span>❌</span><span>Lỗi thử lại</span>
                        <button onclick="retryAsyncVariableUpdate()" style="margin-left:10px;padding:4px 12px;background:white;color:#dc3545;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:bold;">🔄 Thử lại</button>
                        <button onclick="document.getElementById('asyncVariableIndicator').style.display='none'" style="margin-left:5px;padding:4px 8px;background:transparent;color:white;border:1px solid white;border-radius:5px;cursor:pointer;font-size:12px;">✕</button>
                    `;
                    asyncIndicator.style.background = 'linear-gradient(135deg, #dc3545 0%, #fd7e14 100%)';
                }
            }
        }

        // Xử lý phản hồi từ AI
        function handleAIResponse(response) {
            // Chế độ gỡ lỗi (Debug): Trực tiếp hiển thị phản hồi thô, không thực hiện bất kỳ việc phân tích cú pháp hay kết xuất nào
            const debugCheckbox = document.getElementById('debugMode');
            if (debugCheckbox && debugCheckbox.checked) {
                appendDebug('AI', response);
                // Trong chế độ gỡ lỗi, chỉ hiển thị, không lưu vào CSDL và không cập nhật biến
                return;
            }

            // ✅ Sử dụng công cụ xử lý JSON nâng cao (Đảm bảo không bị lỗi)
            let data;
            try {
                data = processAIResponse(response);
            } catch (error) {
                console.error('❌ Lỗi processAIResponse:', error);
                // Phương án dự phòng: Xây dựng dữ liệu tối thiểu có thể sử dụng
                data = {
                    reasoning: { situation: 'Lỗi phân tích cú pháp', playerChoice: '', logicChain: [], outcome: '' },
                    variableChanges: { analysis: 'Lỗi parse', changes: {} },
                    story: 'Lỗi hệ thống: Phân tích cú pháp phản hồi từ AI thất bại\n\n' + response.substring(0, 500),
                    options: ['Tạo lại', 'Thử tiếp tục', 'Xem nhật ký (log)', 'Trở về menu', 'Lưu và thoát']
                };
            }

            // Cập nhật biến (Hỗ trợ 3 định dạng)
            console.log('[game.html] Bắt đầu xử lý cập nhật biến, đối tượng data:', data);
            console.log('[game.html] data.variableUpdate tồn tại:', !!data.variableUpdate);
            console.log('[game.html] data.variableChanges tồn tại:', !!data.variableChanges);
            console.log('[game.html] data.variables tồn tại:', !!data.variables);

            // 🆕 Chế độ biến bất đồng bộ: Luôn để API bổ sung xử lý cập nhật biến (Bỏ qua variableUpdate của API chính)
            const extraConfigForAsync = window.extraApiConfig || (typeof extraApiConfig !== 'undefined' ? extraApiConfig : null);
            const asyncVariableEnabled = window.asyncVariableEnabled && extraConfigForAsync?.enabled;

            if (asyncVariableEnabled && data.story) {
                console.log('[Biến bất đồng bộ] 🔄 Chế độ biến bất đồng bộ đã được bật, API bổ sung sẽ xử lý cập nhật biến');
                if (data.variableUpdate) {
                    console.log('[Biến bất đồng bộ] ⚠️ API chính trả về variableUpdate, nhưng sẽ bị bỏ qua trong chế độ bất đồng bộ');
                }
                const turnIndex = Math.floor(gameState.conversationHistory.length / 2) + 1;

                // 🆕 Hiển thị chỉ báo tải biến bất đồng bộ
                let asyncIndicator = document.getElementById('asyncVariableIndicator');
                if (!asyncIndicator) {
                    asyncIndicator = document.createElement('div');
                    asyncIndicator.id = 'asyncVariableIndicator';
                    asyncIndicator.style.cssText = `
                        position: fixed;
                        bottom: 20px;
                        right: 20px;
                        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                        color: white;
                        padding: 12px 20px;
                        border-radius: 10px;
                        font-size: 14px;
                        font-weight: bold;
                        z-index: 10000;
                        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.5);
                        display: flex;
                        align-items: center;
                        gap: 10px;
                        animation: pulse 1.5s ease-in-out infinite;
                    `;
                    // Thêm hiệu ứng hoạt hình nhịp đập (pulse)
                    const style = document.createElement('style');
                    style.textContent = `
                        @keyframes pulse {
                            0%, 100% { opacity: 1; transform: scale(1); }
                            50% { opacity: 0.8; transform: scale(1.02); }
                        }
                        @keyframes spin {
                            from { transform: rotate(0deg); }
                            to { transform: rotate(360deg); }
                        }
                    `;
                    document.head.appendChild(style);
                    document.body.appendChild(asyncIndicator);
                }
                asyncIndicator.innerHTML = `
                    <span style="display: inline-block; animation: spin 1s linear infinite;">🔄</span>
                    <span>Đang cập nhật biến...</span>
                `;
                asyncIndicator.style.display = 'flex';

                // 🆕 Lưu tham số gọi biến bất đồng bộ, dùng cho tính năng thử lại (retry)
                window.lastAsyncVariableParams = {
                    storyText: data.story,
                    response: response,
                    turnIndex: turnIndex
                };

                // Xử lý bất đồng bộ, không cản trở luồng chính
                // 🆕 Đồng thời thực thi: Cập nhật biến bất đồng bộ + Trích xuất ngữ nghĩa GraphRAG
                const asyncVariablePromise = processAsyncVariableUpdate(data.story, response, turnIndex);

                // Trích xuất GraphRAG (Chạy ngầm, không ảnh hưởng đến UI)
                const graphRAGPromise = (async () => {
                    if (window.extractGraphRAG && window.graphRAGLite?.config?.enabled) {
                        try {
                            console.log('[GraphRAG-Lite] 🔄 Bắt đầu trích xuất ngữ nghĩa đồng thời...');
                            // 🔧 Sửa lỗi: Lấy văn bản đầu vào thực tế của người dùng, thay vì thẻ HTML
                            let userInputText = '';
                            const userInputElement = document.getElementById('userInput');
                            if (userInputElement && userInputElement.value) {
                                userInputText = userInputElement.value;
                            } else {
                                // Ở giai đoạn đầu game, sử dụng tin nhắn cuối cùng của người dùng làm input
                                const lastUserMsg = gameState.conversationHistory.findLast(m => m.role === 'user');
                                userInputText = lastUserMsg?.content || '(Bắt đầu game)';
                            }
                            const graphResult = await window.extractGraphRAG(userInputText, { story: data.story, turnIndex });
                            if (graphResult?.semanticUpsert) {
                                await window.graphRAGLite.processUpdate(graphResult.semanticUpsert);
                                console.log('[GraphRAG-Lite] ✅ Trích xuất ngữ nghĩa hoàn tất');
                            }
                        } catch (err) {
                            console.error('[GraphRAG-Lite] ❌ Trích xuất ngữ nghĩa thất bại:', err);
                        }
                    }
                })();

                // Chờ biến bất đồng bộ hoàn thành (GraphRAG chạy ngầm ở background)
                asyncVariablePromise.then(result => {
                    // Cập nhật trạng thái hiển thị
                    if (asyncIndicator) {
                        if (result) {
                            asyncIndicator.innerHTML = `<span>✅</span><span>Cập nhật biến hoàn tất</span>`;
                            asyncIndicator.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';
                            setTimeout(() => { asyncIndicator.style.display = 'none'; }, 2000);
                        } else {
                            asyncIndicator.innerHTML = `
                                    <span>⚠️</span><span>Cập nhật biến thất bại</span>
                                    <button onclick="retryAsyncVariableUpdate()" style="margin-left:10px;padding:4px 12px;background:white;color:#dc3545;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:bold;">🔄 Thử lại</button>
                                    <button onclick="document.getElementById('asyncVariableIndicator').style.display='none'" style="margin-left:5px;padding:4px 8px;background:transparent;color:white;border:1px solid white;border-radius:5px;cursor:pointer;font-size:12px;">✕</button>
                                `;
                            asyncIndicator.style.background = 'linear-gradient(135deg, #dc3545 0%, #fd7e14 100%)';
                        }
                    }
                    if (result) {
                        console.log('[Biến bất đồng bộ] ✅ Cập nhật biến từ API bổ sung hoàn tất');
                        // Lưu vào IndexedDB
                        saveGameHistory().catch(err => console.error('[Lưu game] Lỗi khi lưu:', err));
                    }
                })
                    .catch(err => {
                        console.error('[Biến bất đồng bộ] Xử lý ngoại lệ:', err);
                        if (asyncIndicator) {
                            asyncIndicator.innerHTML = `
                                <span>❌</span><span>Cập nhật gặp lỗi</span>
                                <button onclick="retryAsyncVariableUpdate()" style="margin-left:10px;padding:4px 12px;background:white;color:#dc3545;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:bold;">🔄 Thử lại</button>
                                <button onclick="document.getElementById('asyncVariableIndicator').style.display='none'" style="margin-left:5px;padding:4px 8px;background:transparent;color:white;border:1px solid white;border-radius:5px;cursor:pointer;font-size:12px;">✕</button>
                            `;
                            asyncIndicator.style.background = 'linear-gradient(135deg, #dc3545 0%, #fd7e14 100%)';
                        }
                    });

                // Trong chế độ bất đồng bộ sẽ không thực thi xử lý variableUpdate của API chính
                data.variableUpdate = null;
            }

            if (data.variableUpdate) {
                try {
                    // Định dạng đơn giản v3.1 (Được khuyến nghị)
                    console.log('[v3.1] 🎯 Dùng định dạng đơn giản v3.1 để cập nhật biến');
                    console.log('[v3.1] Nội dung variableUpdate:', data.variableUpdate);

                    // Khởi tạo bộ phân tích cú pháp v3.1

                        console.log('[v3.1] Đang khởi tạo bộ phân tích cú pháp...');
                        window.v31Parser = new VariableInstructionParserV31(gameState, {
                            debug: true,
                            enableRollback: false
                        });
                        console.log('[v3.1] Đã khởi tạo xong bộ phân tích cú pháp');
                    }

                    // Phân tích cú pháp và thực thi cập nhật biến
                    const result = window.v31Parser.execute(data.variableUpdate);
                    console.log('[v3.1] ✅ Kết quả cập nhật:', result);

                    // 🆕 Tự động trích xuất thông tin nhân vật vào biểu đồ (Graph)
                    if (window.characterGraphIntegration &&
                        window.characterGraphIntegration.isEnabled &&
                        gameState.variables &&
                        gameState.variables.relationships &&
                        Array.isArray(gameState.variables.relationships)) {
                        console.log(`[Biểu đồ nhân vật] 📥 Đang tự động trích xuất ${gameState.variables.relationships.length} nhân vật vào biểu đồ...`);
                        window.characterGraphIntegration.extractCharactersFromResponse(gameState.variables.relationships)
                            .catch(err => console.error('[Biểu đồ nhân vật] Trích xuất thất bại:', err));
                    }

                    updateStatusPanel();
                    showAttributeChanges();
                } catch (error) {
                    console.error('❌ Lỗi cập nhật biến v3.1:', error);
                    console.error('Chi tiết lỗi:', error.message);
                    console.error('Nội dung variableUpdate:', data.variableUpdate);
                }
            } else if (data.variableChanges) {
                try {
                    // Phương án cũ: Cập nhật tăng dần (Incremental Update)
                    applyVariableChanges(data.variableChanges);

                    // 🆕 Tự động trích xuất thông tin nhân vật vào biểu đồ
                    if (window.characterGraphIntegration &&
                        window.characterGraphIntegration.isEnabled &&
                        gameState.variables &&
                        gameState.variables.relationships &&
                        Array.isArray(gameState.variables.relationships)) {
                        console.log(`[Biểu đồ nhân vật] 📥 Đang tự động trích xuất ${gameState.variables.relationships.length} nhân vật vào biểu đồ...`);
                        window.characterGraphIntegration.extractCharactersFromResponse(gameState.variables.relationships)
                            .catch(err => console.error('[Biểu đồ nhân vật] Trích xuất thất bại:', err));
                    }

                    updateStatusPanel();
                    showAttributeChanges();
                } catch (error) {
                    console.error('❌ Lỗi cập nhật biến:', error);
                }
            } else if (data.variables) {
                try {
                    // Phương án cũ: Form toàn bộ biến (Hỗ trợ tương thích ngược)
                    updateVariables(data.variables);

                    // 🆕 Tự động trích xuất thông tin nhân vật vào biểu đồ
                    if (window.characterGraphIntegration &&
                        window.characterGraphIntegration.isEnabled &&
                        gameState.variables &&
                        gameState.variables.relationships &&
                        Array.isArray(gameState.variables.relationships)) {
                        console.log(`[Biểu đồ nhân vật] 📥 Đang tự động trích xuất ${gameState.variables.relationships.length} nhân vật vào biểu đồ...`);
                        window.characterGraphIntegration.extractCharactersFromResponse(gameState.variables.relationships)
                            .catch(err => console.error('[Biểu đồ nhân vật] Trích xuất thất bại:', err));
                    }

                    updateStatusPanel();
                    showAttributeChanges();
                } catch (error) {
                    console.error('❌ Lỗi cập nhật biến (Phương án cũ):', error);
                }
            }

            // Thêm vào lịch sử trò chuyện (Lưu cốt truyện + Raw Response/JSON + imgPrompt)
            if (data.story) {
                gameState.conversationHistory.push({
                    role: 'assistant',
                    content: data.story,
                    rawResponse: response,
                    parsed: data,
                    imgPrompt: data.img || null  // 🎨 Lưu lại prompt ảnh để dùng khi khôi phục từ file save
                });

                // Lưu ảnh chụp nhanh (snapshot) của biến hiện tại
                gameState.variableSnapshots.push(JSON.parse(JSON.stringify(gameState.variables)));

                // 【Mới thêm】 Nếu bật tính năng tra cứu vector, thêm vào thư viện vector
                const enableVectorRetrieval = document.getElementById('enableVectorRetrieval')?.checked || false;
                if (enableVectorRetrieval && window.contextVectorManager && gameState.conversationHistory.length >= 2) {
                    const turnIndex = Math.floor(gameState.conversationHistory.length / 2);
                    const userMessage = gameState.conversationHistory[gameState.conversationHistory.length - 2].content;
                    const aiResponse = data.story;

                    // Bất đồng bộ thêm vào thư viện vector (Không cản trở luồng chạy của game)
                    window.contextVectorManager.addConversation(
                        userMessage,
                        aiResponse,
                        turnIndex,
                        gameState.variables
                    ).then(async () => {
                        // 🆕 Trích xuất và thêm history vào ma trận (matrix)
                        if (data.variableUpdate) {
                            await extractAndAddHistoryToMatrix(data.variableUpdate, turnIndex);
                        }

                        // Lưu thư viện vector vào IndexedDB
                        return window.contextVectorManager.saveToIndexedDB();
                    }).catch(err => {
                        console.error('❌ Lỗi khi thêm vào thư viện vector:', err);
                        console.error('Chi tiết lỗi:', err.stack);

                        // Tự động lùi về phương thức tra cứu bằng từ khóa (keyword)
                        const currentMethod = window.contextVectorManager.embeddingMethod;
                        if (currentMethod !== 'keyword') {
                            console.warn(`[Thư viện vector] Phương thức ${currentMethod} thất bại, tự động chuyển sang phương thức so khớp từ khóa`);
                            window.contextVectorManager.setEmbeddingMethod('keyword');
                            document.getElementById('vectorMethod').value = 'keyword';

                            // Thông báo cho người dùng
                            setTimeout(() => {
                                alert(`⚠️ Việc vector hóa đã thất bại\n\nPhương thức ${currentMethod} gặp lỗi, đã tự động chuyển sang phương thức "So khớp từ khóa"\n\nLỗi: ${err.message}\n\nGame sẽ tiếp tục bình thường, không ảnh hưởng đến quá trình chơi.`);
                            }, 1000);
                        }
                    });
                }
            }

            // Tính năng phát hiện tình huống chiến đấu đã bị tắt
            // Xóa thông tin chiến đấu đang chờ xử lý
            window.pendingCombatInfo = null;

            // Hiển thị tin nhắn bình thường (Truyền tham số img để NovelAI vẽ ảnh)
            displayAIMessage(data.story, data.options, data.reasoning, data.img);

            // Lưu lịch sử game
            saveGameHistory().catch(err => console.error('Lỗi khi lưu lịch sử:', err));

            if (gameState && gameState.localOps) {
                gameState.localOps = { items: [], attrs: [], equip: [] };
            }
        }

        // Chế độ gỡ lỗi: Chuyển đổi vùng hiển thị
        // Các hàm liên quan đến chế độ gỡ lỗi đã được dời sang file game-initialization.js

        // Phục hồi hiển thị lịch sử trò chuyện
        // Hàm restoreConversationHistory đã được dời sang file game-initialization.js

        /**
         * Áp dụng cập nhật biến tăng dần (Phương án mới)
         * @param {Object} variableChanges - Đối tượng variableChanges do AI trả về
         * @returns {Object} Trạng thái biến sau khi cập nhật
         */
        function applyVariableChanges(variableChanges) {
            if (!variableChanges) {
                console.warn('[Cập nhật biến] Không có dữ liệu biến đổi');
                return gameState.variables;
            }

            const { analysis, changes = {}, arrayChanges, newFields = [], removedFields = [] } = variableChanges;

            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.log('[Cập nhật biến] Bắt đầu áp dụng cập nhật tăng dần');
            if (analysis) {
                console.log('[Cập nhật biến] Phân tích:', analysis);
            }
            if (Object.keys(changes).length > 0) {
                console.log('[Cập nhật biến] Các trường thay đổi:', Object.keys(changes));
            }
            if (arrayChanges) {
                console.log('[Cập nhật biến] Cập nhật tăng dần cho mảng:', Object.keys(arrayChanges));
            }
            if (newFields.length > 0) {
                console.log('[Cập nhật biến] Các trường thêm mới:', newFields);
            }
            if (removedFields.length > 0) {
                console.log('[Cập nhật biến] Các trường bị xóa:', removedFields);
            }

            // Lưu trạng thái biến trước đó để tính toán sự thay đổi
            gameState.previousVariables = JSON.parse(JSON.stringify(gameState.variables));

            // 1. Xử lý những thay đổi của các trường thông thường
            for (const [key, value] of Object.entries(changes)) {
                applyFieldChange(key, value);
            }

            // 2. Xử lý cập nhật tăng dần cho các trường dạng mảng (Tính năng mới)
            if (arrayChanges) {
                applyArrayChanges(arrayChanges);
            }

            // 3. Xóa các trường được đánh dấu là sẽ loại bỏ
            removedFields.forEach(field => {
                if (gameState.variables.hasOwnProperty(field)) {
                    delete gameState.variables[field];
                    console.log(`[Cập nhật biến] ❌ Đã xóa trường: ${field}`);
                }
            });

            console.log('[Cập nhật biến] ✅ Cập nhật tăng dần đã hoàn thành');
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');

            return gameState.variables;
        }

        /**
         * Áp dụng cập nhật tăng dần cho các trường dạng mảng (chế độ add/remove/update)
         * @param {Object} arrayChanges - Đối tượng cập nhật mảng tăng dần
         */
        function applyArrayChanges(arrayChanges) {
            for (const [arrayName, operations] of Object.entries(arrayChanges)) {
                if (!gameState.variables[arrayName]) {
                    gameState.variables[arrayName] = [];
                }

                const array = gameState.variables[arrayName];
                const emoji = {
                    'items': '🎒',
                    'relationships': '👥',
                    'techniques': '📖',
                    'spells': '✨'
                }[arrayName] || '📝';

                console.log(`[Cập nhật mảng] ${emoji} Xử lý mảng ${arrayName}:`);

                // 1. Xử lý thao tác xóa (remove)
                if (operations.remove && operations.remove.length > 0) {
                    operations.remove.forEach(item => {
                        removeFromArray(array, item, arrayName);
                    });
                }

                // 2. Xử lý thao tác thêm (add)
                if (operations.add && operations.add.length > 0) {
                    operations.add.forEach(item => {
                        addToArray(array, item, arrayName);
                    });
                }

                // 3. Xử lý thao tác cập nhật (update)
                if (operations.update && operations.update.length > 0) {
                    operations.update.forEach(item => {
                        updateInArray(array, item, arrayName);
                    });
                }
            }
        }

        /**
         * Xóa phần tử hoặc giảm số lượng trong mảng
         * @param {Array} array - Mảng đích
         * @param {Object} item - Phần tử cần xóa
         * @param {string} arrayName - Tên mảng
         */
        function removeFromArray(array, item, arrayName) {
            const index = array.findIndex(el => el.name === item.name);

            if (index === -1) {
                console.warn(`  ⚠️ Cố gắng xóa phần tử không tồn tại trong ${arrayName}: ${item.name}`);
                return;
            }

            // Nếu mảng là 'items' và có thuộc tính 'count', thì tiến hành giảm số lượng
            if (arrayName === 'items' && item.count !== undefined) {
                const oldCount = array[index].count;
                array[index].count -= item.count;
                console.log(`  ➖ ${item.name}: Số lượng giảm đi -${item.count} (${oldCount} → ${array[index].count})`);

                // Nếu số lượng <= 0, tiến hành xóa hoàn toàn
                if (array[index].count <= 0) {
                    array.splice(index, 1);
                    console.log(`  ❌ ${item.name}: Số lượng về 0, đã bị xóa khỏi danh sách túi đồ`);
                }
            } else {
                // Xóa hoàn toàn
                array.splice(index, 1);
                console.log(`  ❌ Xóa bỏ ${item.name}`);
            }
        }

        /**
         * Thêm phần tử hoặc tăng số lượng trong mảng
         * @param {Array} array - Mảng đích
         * @param {Object} item - Phần tử cần thêm
         * @param {string} arrayName - Tên mảng
         */
        function addToArray(array, item, arrayName) {
            const existingIndex = array.findIndex(el => el.name === item.name);

            // Nếu mảng là 'items' và đã tồn tại, thì tiến hành tăng số lượng
            if (arrayName === 'items' && existingIndex !== -1) {
                const oldCount = array[existingIndex].count;
                array[existingIndex].count += item.count;
                console.log(`  ➕ ${item.name}: Số lượng thêm +${item.count} (${oldCount} → ${array[existingIndex].count})`);

                // Cập nhật các thuộc tính khác (Nếu có sự thay đổi)
                Object.assign(array[existingIndex], item);
            } else if (existingIndex !== -1) {
                // Với các loại mảng khác, nếu đã tồn tại thì tiến hành thay thế
                array[existingIndex] = item;
                console.log(`  🔄 Đã thay thế ${item.name}`);
            } else {
                // Nếu không tồn tại thì thêm mới
                array.push(item);
                const extra = arrayName === 'items' ? ` (Số lượng: ${item.count})` : '';
                console.log(`  ✅ Đã thêm mới ${item.name}${extra}`);
            }
        }

        /**
         * Cập nhật phần tử đã tồn tại trong mảng
         * @param {Array} array - Mảng đích
         * @param {Object} item - Phần tử cần cập nhật (Bao gồm tên và các thuộc tính cần cập nhật)
         * @param {string} arrayName - Tên mảng
         */
        function updateInArray(array, item, arrayName) {
            const existingIndex = array.findIndex(el => el.name === item.name);

            if (existingIndex === -1) {
                console.warn(`  ⚠️ Cố gắng cập nhật phần tử không tồn tại trong ${arrayName}: ${item.name}`);
                return;
            }

            // Ghi lại giá trị cũ
            const oldValues = {};
            const updatedFields = Object.keys(item).filter(k => k !== 'name');
            updatedFields.forEach(field => {
                oldValues[field] = array[existingIndex][field];
            });

            // Xử lý đặc biệt: Thuộc tính history của mảng relationships cần được thêm vào cuối mảng (append) thay vì ghi đè (overwrite)
            if (arrayName === 'relationships' && item.history && Array.isArray(item.history)) {
                const existingHistory = Array.isArray(array[existingIndex].history) ? array[existingIndex].history : [];
                const newHistory = item.history;

                // Loại bỏ trùng lặp khi gộp: Chỉ thêm những bản ghi lịch sử không bị trùng lặp
                const mergedHistory = [...existingHistory];
                let addedCount = 0;

                newHistory.forEach(newItem => {
                    // Kiểm tra xem đã tồn tại nội dung tương tự chưa (Sử dụng hàm trim để xóa khoảng trắng ở 2 đầu trước khi so sánh)
                    const trimmedNew = newItem.trim();
                    const isDuplicate = mergedHistory.some(existing => existing.trim() === trimmedNew);

                    if (!isDuplicate && trimmedNew) {
                        mergedHistory.push(newItem);
                        addedCount++;
                    }
                });

                // Cập nhật trường history với mảng sau khi gộp
                item.history = mergedHistory;

                if (addedCount > 0) {
                    console.log(`    - history: Đã thêm mới ${addedCount} bản ghi (Tổng cộng: ${mergedHistory.length} bản ghi)`);
                }
            }

            // Gộp lại các trường cần cập nhật
            Object.assign(array[existingIndex], item);

            // Xuất ra chi tiết log
            console.log(`  🔧 Cập nhật ${item.name}:`);
            updatedFields.forEach(field => {
                if (field === 'history' && arrayName === 'relationships') {
                    // Trường history đã được xử lý ở trên nên bỏ qua log
                    return;
                }
                console.log(`    - ${field}: ${JSON.stringify(oldValues[field])} → ${JSON.stringify(item[field])}`);
            });
        }

        /**
         * Cập nhật từng trường riêng lẻ
         * @param {string} key - Tên trường
         * @param {any} value - Giá trị mới
         */
        function applyFieldChange(key, value) {
            // ========== Xử lý đặc biệt 1: Trường history sẽ sử dụng chế độ nối tiếp (append mode) ==========
            if (key === 'history') {
                if (!gameState.variables.history) {
                    gameState.variables.history = [];
                }
                if (Array.isArray(value)) {
                    let addedCount = 0;
                    value.forEach(newRecord => {
                        const trimmed = newRecord.trim();
                        const isDuplicate = gameState.variables.history.some(
                            existing => existing.trim() === trimmed
                        );
                        if (!isDuplicate && trimmed) {
                            gameState.variables.history.push(newRecord);
                            addedCount++;
                            console.log(`[Cập nhật biến] 📜 Lịch sử mới thêm: ${newRecord.substring(0, 50)}...`);
                        }
                    });
                    console.log(`[Cập nhật biến] history: Đã thêm ${addedCount} bản ghi mới`);
                }
                return;
            }

            // ========== Xử lý đặc biệt 2: Các trường thuộc kiểu Object sẽ được cập nhật một phần (partial update) ==========
            if (key === 'attributes' || key === 'equipment') {
                if (!gameState.variables[key]) {
                    gameState.variables[key] = {};
                }
                const changedKeys = Object.keys(value);
                Object.assign(gameState.variables[key], value);
                console.log(`[Cập nhật biến] 🔧 Cập nhật một phần của ${key}: [${changedKeys.join(', ')}]`);

                // Ghi lại chi tiết sự thay đổi của từng trường phụ
                changedKeys.forEach(subKey => {
                    const oldValue = gameState.previousVariables?.[key]?.[subKey];
                    const newValue = value[subKey];
                    if (oldValue !== undefined) {
                        console.log(`  - ${subKey}: ${JSON.stringify(oldValue)} -> ${JSON.stringify(newValue)}`);
                    } else {
                        console.log(`  - ${subKey}: (Mới) ${JSON.stringify(newValue)}`);
                    }
                });
                return;
            }

// ========== Xử lý đặc biệt 3: Các trường dạng mảng sẽ được thay thế hoàn toàn (Có kiểm tra an toàn)==========
            if (key === 'items' || key === 'relationships' || key === 'techniques' || key === 'spells') {
                const oldCount = gameState.variables[key] ? gameState.variables[key].length : 0;
                const newCount = Array.isArray(value) ? value.length : 0;

                // Kiểm tra an toàn: Ngăn chặn mất mát dữ liệu
                if (oldCount > 5 && newCount < oldCount / 2 && newCount > 0) {
                    console.warn(`⚠️ Số lượng của ${key} giảm bất thường: Từ ${oldCount} xuống còn ${newCount}, có thể đã xảy ra lỗi mất dữ liệu!`);
                    console.warn(`⚠️ Khuyến nghị kiểm tra xem mảng ${key} mà AI trả về có đầy đủ hay không`);
                }

                gameState.variables[key] = value;

                const emoji = {
                    'items': '🎒',
                    'relationships': '👥',
                    'techniques': '📖',
                    'spells': '✨'
                }[key] || '📝';

                console.log(`[Cập nhật biến] ${emoji} Đã thay thế hoàn toàn mảng ${key}: ${oldCount} -> ${newCount}`);

                // Nếu là túi đồ (items), ghi log chi tiết các vật phẩm được thêm mới và bị xóa đi
                if (key === 'items' && gameState.previousVariables?.items) {
                    const oldItems = new Set(gameState.previousVariables.items.map(i => i.name));
                    const newItems = new Set(value.map(i => i.name));

                    const added = [...newItems].filter(name => !oldItems.has(name));
                    const removed = [...oldItems].filter(name => !newItems.has(name));

                    if (added.length > 0) {
                        console.log(`  ✅ Đã thêm vật phẩm mới: ${added.join(', ')}`);
                    }
                    if (removed.length > 0) {
                        console.log(`  ❌ Đã xóa vật phẩm: ${removed.join(', ')}`);
                    }
                }

                // Nếu là danh sách quan hệ (relationships), ghi log chi tiết các mối quan hệ được thêm mới và bị xóa đi
                if (key === 'relationships' && gameState.previousVariables?.relationships) {
                    const oldRels = new Set(gameState.previousVariables.relationships.map(r => r.name));
                    const newRels = new Set(value.map(r => r.name));

                    const added = [...newRels].filter(name => !oldRels.has(name));
                    const removed = [...oldRels].filter(name => !newRels.has(name));

                    if (added.length > 0) {
                        console.log(`  ✅ Đã thêm mối quan hệ mới: ${added.join(', ')}`);
                    }
                    if (removed.length > 0) {
                        console.log(`  ❌ Đã xóa mối quan hệ: ${removed.join(', ')}`);
                    }
                }

                return;
            }

            // ========== Xử lý mặc định: Ghi đè (Thay thế trực tiếp) ==========
            const oldValue = gameState.variables[key];
            gameState.variables[key] = value;

            // Chọn emoji phù hợp dựa theo loại trường dữ liệu
            const emoji = {
                'hp': '❤️',
                'mp': '💙',
                'spiritStones': '💰',
                'age': '📅',
                'realm': '⚡',
                'location': '📍',
                'karmaFortune': '🍀',
                'karmaPunishment': '⚠️',
                'cultivationProgress': '📈',
                'faction': '🏛️'
            }[key] || '🔄';

            if (oldValue !== undefined && oldValue !== value) {
                console.log(`[Cập nhật biến] ${emoji} ${key}: ${JSON.stringify(oldValue)} -> ${JSON.stringify(value)}`);
            } else {
                console.log(`[Cập nhật biến] ${emoji} ${key}: (Mới thêm) ${JSON.stringify(value)}`);
            }
        }

        // Cập nhật toàn bộ biến (Phương án cũ, giữ lại để tương thích ngược)
        function updateVariables(newVars) {
            // Lưu lại trạng thái của các biến trước khi cập nhật để tiện cho việc tính toán chênh lệch
            gameState.previousVariables = JSON.parse(JSON.stringify(gameState.variables));

            // Tiến hành gộp các biến
            if (newVars.currentDateTime !== undefined) gameState.variables.currentDateTime = newVars.currentDateTime;
            if (newVars.name !== undefined) gameState.variables.name = newVars.name;
            if (newVars.age !== undefined) gameState.variables.age = newVars.age;
            if (newVars.gender !== undefined) gameState.variables.gender = newVars.gender;
            if (newVars.realm !== undefined) gameState.variables.realm = newVars.realm;
            if (newVars.identity !== undefined) gameState.variables.identity = newVars.identity;
            if (newVars.spiritStones !== undefined) gameState.variables.spiritStones = newVars.spiritStones;
            if (newVars.location !== undefined) gameState.variables.location = newVars.location;
            if (newVars.karmaFortune !== undefined) gameState.variables.karmaFortune = newVars.karmaFortune;
            if (newVars.karmaPunishment !== undefined) gameState.variables.karmaPunishment = newVars.karmaPunishment;
            if (newVars.cultivationProgress !== undefined) gameState.variables.cultivationProgress = newVars.cultivationProgress;
            if (newVars.cultivationProgressMax !== undefined) gameState.variables.cultivationProgressMax = newVars.cultivationProgressMax;
            if (newVars.hp !== undefined) gameState.variables.hp = newVars.hp;
            if (newVars.hpMax !== undefined) gameState.variables.hpMax = newVars.hpMax;
            if (newVars.mp !== undefined) gameState.variables.mp = newVars.mp;
            if (newVars.mpMax !== undefined) gameState.variables.mpMax = newVars.mpMax;
            if (newVars.talents !== undefined) gameState.variables.talents = newVars.talents;

            // Cập nhật level luyện đan và luyện khí
            if (newVars.alchemyLevel !== undefined) gameState.variables.alchemyLevel = newVars.alchemyLevel;
            if (newVars.craftingLevel !== undefined) gameState.variables.craftingLevel = newVars.craftingLevel;

            // Cập nhật thông tin thế lực
            if (newVars.faction !== undefined) gameState.variables.faction = newVars.faction;

            // Cập nhật thuộc tính
            if (newVars.attributes) {
                Object.assign(gameState.variables.attributes, newVars.attributes);
            }

            // Cập nhật trang bị
            if (newVars.equipment) {
                Object.assign(gameState.variables.equipment, newVars.equipment);
            }

            // Cập nhật vật phẩm (Ghi đè hoàn toàn, có kiểm tra an toàn)
            if (newVars.items) {
                const oldCount = gameState.variables.items ? gameState.variables.items.length : 0;
                const newCount = newVars.items.length;
                if (oldCount > 5 && newCount < oldCount / 2 && newCount > 0) {
                    console.warn(`⚠️ Số lượng vật phẩm bị giảm bất thường: Từ ${oldCount} cái xuống còn ${newCount} cái, có khả năng bị mất dữ liệu!`);
                }

                if (!Array.isArray(gameState.variables.items)) {
                    gameState.variables.items = [];
                }

                const nameIndex = new Map(gameState.variables.items.map(i => [i.name, i]));
                const equippedNames = new Set(Object.values(gameState.variables.equipment || {})
                    .filter(e => e && e.name)
                    .map(e => e.name));
                for (const incoming of newVars.items) {
                    if (!incoming || !incoming.name) continue;
                    const existing = nameIndex.get(incoming.name);
                    const isEquipped = equippedNames.has(incoming.name);
                    if (existing) {
                        if (incoming.type !== undefined) existing.type = incoming.type;
                        if (incoming.effects !== undefined) existing.effects = incoming.effects;
                        if (incoming.count !== undefined) {
                            if (incoming._op === 'set') {
                                existing.count = incoming.count;
                            } else if (incoming._op === 'decrease') {
                                existing.count = Math.max(0, (existing.count || 0) - incoming.count);
                            } else if (incoming._op === 'increase') {
                                existing.count = (existing.count || 0) + (incoming.count || 1);
                            } else {
                                // Mặc định là snapshot: Không đưa các món đồ đã mặc trở lại kho đồ, đồng thời không giảm số lượng các món đã được sử dụng
                                if (isEquipped) {
                                    existing.count = Math.max((existing.count || 0), 0);
                                } else {
                                    existing.count = Math.max((existing.count || 0), incoming.count || 0);
                                }
                            }
                        }
                    } else {
                        // Không có dữ liệu ở local: Nếu vật phẩm đó đang được mặc và AI không gửi kèm tham số _op, thì hiểu rằng vật phẩm này đang được sử dụng làm trang bị, để tránh việc bị tính 2 lần
                        if (isEquipped && !incoming._op) {
                            continue;
                        }
                        gameState.variables.items.push({
                            name: incoming.name,
                            count: incoming._op === 'set' ? (incoming.count ?? 1) : (incoming.count ?? 1),
                            type: incoming.type,
                            effects: incoming.effects
                        });
                    }
                }
            }

            // Cập nhật công pháp (Ghi đè hoàn toàn, có kiểm tra an toàn)
            if (newVars.techniques) {
                const oldCount = gameState.variables.techniques ? gameState.variables.techniques.length : 0;
                const newCount = newVars.techniques.length;
                if (oldCount > 3 && newCount < oldCount / 2 && newCount > 0) {
                    console.warn(`⚠️ Số lượng công pháp giảm sút đáng ngờ: Từ ${oldCount} bộ xuống còn ${newCount} bộ, có khả năng bị mất dữ liệu!`);
                }
                gameState.variables.techniques = newVars.techniques;
            }

            // Cập nhật phép thuật (Ghi đè hoàn toàn, có kiểm tra an toàn)
            if (newVars.spells) {
                const oldCount = gameState.variables.spells ? gameState.variables.spells.length : 0;
                const newCount = newVars.spells.length;
                if (oldCount > 3 && newCount < oldCount / 2 && newCount > 0) {
                    console.warn(`⚠️ Số lượng phép thuật giảm sút đáng ngờ: Từ ${oldCount} pháp thuật xuống còn ${newCount} pháp thuật, có khả năng bị mất dữ liệu!`);
                }
                gameState.variables.spells = newVars.spells;
            }

            // Cập nhật các mối quan hệ xã hội (Ghi đè hoàn toàn, có kiểm tra an toàn)
            if (newVars.relationships) {
                const oldCount = gameState.variables.relationships ? gameState.variables.relationships.length : 0;
                const newCount = newVars.relationships.length;
                if (oldCount > 3 && newCount < oldCount / 2 && newCount > 0) {
                    console.warn(`⚠️ Số lượng các mối quan hệ xã hội bị suy giảm nghiêm trọng: Từ ${oldCount} người xuống còn ${newCount} người, có khả năng bị mất dữ liệu!`);
                }
                gameState.variables.relationships = newVars.relationships;
            }

            // Cập nhật nhật ký lịch sử (Chế độ bổ sung (Append mode) - Chỉ thêm dữ liệu mới, không xóa bản ghi cũ)
            if (newVars.history && Array.isArray(newVars.history)) {
                // Phải đảm bảo rằng mảng history đã tồn tại
                if (!gameState.variables.history) {
                    gameState.variables.history = [];
                }

                // Cập nhật thêm các bản ghi mới (Khử trùng lặp: Tránh lưu lại những nội dung đã có sẵn)
                newVars.history.forEach(newRecord => {
                    const trimmedNew = newRecord.trim();
                    // So sánh nội dung xem đã tồn tại hay chưa (Xóa đi khoảng trống ở đầu và đuôi trước khi tiến hành so sánh)
                    const isDuplicate = gameState.variables.history.some(existing =>
                        existing.trim() === trimmedNew

                    if (!isDuplicate && trimmedNew) {
                        gameState.variables.history.push(newRecord);
                        console.log('[Nhật ký lịch sử] Mới được thêm:', newRecord.substring(0, 50) + '...');
                    }
                });
            }

            // Cập nhật giao diện UI
            updateStatusPanel();

            // Hiển thị những sự thay đổi ở phần thuộc tính
            showAttributeChanges();
        }

// Tính toán thuộc tính thực tế (Cơ bản + Buff trang bị)
        // Tính toán thuộc tính thực tế hiện tại (Bao gồm buff trang bị) - Đã chuyển sang game-core-systems.js

        // Vẽ biểu đồ radar 6 chiều thuộc tính
        function drawRadarChart() {
            const canvas = document.getElementById('radarChart');
            if (!canvas) return;

            // Thiết lập kích thước responsive cho Canvas
            const container = canvas.parentElement;
            const containerWidth = container.clientWidth;

            // Tính toán kích thước động, thiết lập giá trị tối thiểu 200px, tối đa 300px
            let size = Math.max(Math.min(containerWidth - 20, 300), 200);

            // Tự động điều chỉnh không gian khoảng trắng của nhãn dựa theo kích thước
            let labelPadding = 40; // Khoảng trắng mặc định
            let fontSize = 12; // Kích thước chữ mặc định
            let valueFontSize = 10; // Kích thước chữ của giá trị

            if (size < 220) {
                labelPadding = 30;
                fontSize = 10;
                valueFontSize = 9;
            } else if (size < 260) {
                labelPadding = 35;
                fontSize = 11;
                valueFontSize = 9;
            }

            // Thiết lập kích thước pixel thực tế cho Canvas (Hỗ trợ độ phân giải cao)
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;

            // Thiết lập kích thước hiển thị CSS
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';

            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);

            // Lấy giá trị thuộc tính thực tế
            const actualAttributes = calculateActualAttributes();

            // Cấu hình thuộc tính 6 chiều
            const attributes = [
                { key: 'physique', label: 'Thể chất', value: actualAttributes.physique || 0 },
                { key: 'fortune', label: 'Khí vận', value: actualAttributes.fortune || 0 },
                { key: 'comprehension', label: 'Ngộ tính', value: actualAttributes.comprehension || 0 },
                { key: 'spirit', label: 'Tinh thần', value: actualAttributes.spirit || 0 },
                { key: 'potential', label: 'Tiềm lực', value: actualAttributes.potential || 0 },
                { key: 'charisma', label: 'Mê lực', value: actualAttributes.charisma || 0 }
            ];

            // Tính giá trị lớn nhất (Dùng để thu phóng)
            const maxValue = Math.max(...attributes.map(a => a.value), 100);
            const levels = 5; // 5 tầng
            const center = size / 2;
            const radius = size / 2 - labelPadding; // Điều chỉnh không gian nhãn động

            // Xóa sạch canvas
            ctx.clearRect(0, 0, size, size);

            // Vẽ lưới nền
            ctx.strokeStyle = 'rgba(139, 69, 19, 0.2)';
            ctx.fillStyle = 'rgba(139, 69, 19, 0.05)';

            for (let i = levels; i > 0; i--) {
                ctx.beginPath();
                const r = (radius / levels) * i;

                for (let j = 0; j < 6; j++) {
                    const angle = (Math.PI * 2 / 6) * j - Math.PI / 2;
                    const x = center + r * Math.cos(angle);
                    const y = center + r * Math.sin(angle);

                    if (j === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }

                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            // Vẽ đường phân cách
            ctx.strokeStyle = 'rgba(139, 69, 19, 0.3)';
            ctx.lineWidth = 1;

            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI * 2 / 6) * i - Math.PI / 2;
                const x = center + radius * Math.cos(angle);
                const y = center + radius * Math.sin(angle);

                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.lineTo(x, y);
                ctx.stroke();
            }

            // Vẽ khu vực dữ liệu thuộc tính
            ctx.fillStyle = 'rgba(139, 69, 19, 0.3)';
            ctx.strokeStyle = 'rgba(139, 69, 19, 0.8)';
            ctx.lineWidth = 2;
            ctx.beginPath();

            attributes.forEach((attr, index) => {
                const angle = (Math.PI * 2 / 6) * index - Math.PI / 2;
                const valueRadius = (attr.value / maxValue) * radius;
                const x = center + valueRadius * Math.cos(angle);
                const y = center + valueRadius * Math.sin(angle);

                if (index === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });

            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Vẽ các điểm dữ liệu
            ctx.fillStyle = 'rgba(139, 69, 19, 0.9)';
            attributes.forEach((attr, index) => {
                const angle = (Math.PI * 2 / 6) * index - Math.PI / 2;
                const valueRadius = (attr.value / maxValue) * radius;
                const x = center + valueRadius * Math.cos(angle);
                const y = center + valueRadius * Math.sin(angle);

                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // Vẽ nhãn thuộc tính và giá trị
            ctx.fillStyle = '#8b4513';
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            attributes.forEach((attr, index) => {
                const angle = (Math.PI * 2 / 6) * index - Math.PI / 2;
                const labelRadius = radius + (labelPadding * 0.75); // Khoảng cách nhãn điều chỉnh một chút
                let x = center + labelRadius * Math.cos(angle);
                let y = center + labelRadius * Math.sin(angle);

                // Điều chỉnh cách căn lề văn bản
                if (Math.abs(angle) < 0.1) {
                    ctx.textAlign = 'center';
                } else if (Math.cos(angle) > 0) {
                    ctx.textAlign = 'left';
                } else {
                    ctx.textAlign = 'right';
                }

                // Vẽ nhãn
                ctx.fillText(attr.label, x, y - (fontSize * 0.6));

                // Vẽ giá trị
                ctx.font = `${valueFontSize}px Arial`;
                ctx.fillStyle = '#666';
                ctx.fillText(attr.value.toString(), x, y + (valueFontSize * 0.5));

                // Khôi phục font chữ
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.fillStyle = '#8b4513';
            });
        }

        // Trang bị đạo cụ
        function equipItem(itemName) {
            const item = gameState.variables.items.find(i => i.name === itemName);
            if (!item || !item.type || !item.type.startsWith('Trang bị-')) {
                alert('Vật phẩm này không thể trang bị');
                return;
            }

            let equipSlot = null;
            switch (item.type) {
                case 'Trang bị-Phần đầu':
                    equipSlot = 'head';
                    break;
                case 'Trang bị-Y phục':
                    equipSlot = 'clothes';
                    break;
                case 'Trang bị-Phần chân':
                    equipSlot = 'feet';
                    break;
                case 'Trang bị-Đặc biệt':
                    // Tìm ô đặc biệt trống đầu tiên
                    if (!gameState.variables.equipment.treasure1) {
                        equipSlot = 'treasure1';
                    } else if (!gameState.variables.equipment.treasure2) {
                        equipSlot = 'treasure2';
                    } else if (!gameState.variables.equipment.treasure3) {
                        equipSlot = 'treasure3';
                    } else {
                        alert('Ô đặc biệt đã đầy, vui lòng tháo một trang bị đặc biệt xuống trước');
                        return;
                    }
                    break;
                default:
                    alert('Loại trang bị không xác định');
                    return;
            }

            // Tháo trang bị cũ xuống (nếu có)
            if (gameState.variables.equipment[equipSlot]) {
                const oldItem = gameState.variables.equipment[equipSlot];
                // Đưa trang bị cũ về lại túi đồ
                const existingItem = gameState.variables.items.find(i => i.name === oldItem.name);
                if (existingItem) {
                    existingItem.count++;
                } else {
                    gameState.variables.items.push({
                        name: oldItem.name,
                        count: 1,
                        type: oldItem.type || 'Trang bị-Chưa rõ',
                        effects: oldItem.effects
                    });
                }
            }

            // Mặc trang bị mới
            gameState.variables.equipment[equipSlot] = {
                name: item.name,
                type: item.type,
                effects: item.effects || {}
            };

            // Xóa một vật phẩm khỏi túi đồ
            item.count--;
            if (item.count <= 0) {
                const index = gameState.variables.items.indexOf(item);
                gameState.variables.items.splice(index, 1);
            }

            // 🆕 Ghi lại thao tác trang bị vào cache (chỉ ghi lại trang bị cuối cùng)
            gameState.pendingActions.equipment = item.name;

            // Cập nhật UI
            updateStatusPanel();

            // Lưu trạng thái game
            saveGameHistory().catch(err => console.error('Lưu thất bại:', err));
        }

        // Tháo trang bị
        function unequipItem(slot) {
            const equipment = gameState.variables.equipment[slot];
            if (!equipment) {
                return; // Không có trang bị, không làm gì cả
            }

            // Đưa trang bị về lại túi đồ
            const existingItem = gameState.variables.items.find(i => i.name === equipment.name);
            if (existingItem) {
                existingItem.count++;
            } else {
                gameState.variables.items.push({
                    name: equipment.name,
                    count: 1,
                    type: equipment.type || 'Trang bị-Chưa rõ',
                    effects: equipment.effects
                });
            }

            // Làm trống ô trang bị
            gameState.variables.equipment[slot] = null;

            // Cập nhật UI
            updateStatusPanel();

            // Lưu trạng thái game
            saveGameHistory().catch(err => console.error('Lưu thất bại:', err));
        }

        // Dùng đan dược
        function usePill(itemIndex) {
            const item = gameState.variables.items[itemIndex];
            if (!item || !item.type || !(item.type.includes('Đan dược') || item.type.includes('Đan'))) {
                alert('Vật phẩm này không phải là đan dược');
                return;
            }

            if (item.count <= 0) {
                alert('Số lượng đan dược không đủ');
                return;
            }

            // Áp dụng hiệu quả của đan dược
            if (item.effects) {
                let effectMessages = [];

                Object.entries(item.effects).forEach(([attr, value]) => {
                    if (attr === 'cultivationProgress') {
                        // Tăng tiến độ tu luyện
                        gameState.variables.cultivationProgress = (gameState.variables.cultivationProgress || 0) + value;
                        effectMessages.push(`Tiến độ tu luyện+${value}`);

                        // Kiểm tra xem đã đạt điều kiện đột phá chưa
                        if (gameState.variables.cultivationProgress >= gameState.variables.cultivationProgressMax) {
                            effectMessages.push('Đã đạt điều kiện đột phá! Vui lòng chọn tùy chọn đột phá trong cốt truyện');
                        }
                    } else if (attr === 'hp') {
                        // Hồi phục thể lực
                        gameState.variables.hp = Math.min(
                            (gameState.variables.hp || 0) + value,
                            gameState.variables.hpMax || 100
                        );
                        effectMessages.push(`Thể lực+${value}`);
                    } else if (attr === 'mp') {
                        // Hồi phục pháp lực
                        gameState.variables.mp = Math.min(
                            (gameState.variables.mp || 0) + value,
                            gameState.variables.mpMax || 100
                        );
                        effectMessages.push(`Pháp lực+${value}`);
                    } else if (attr === 'hpMax') {
                        // Tăng giới hạn thể lực
                        gameState.variables.hpMax = (gameState.variables.hpMax || 100) + value;
                        effectMessages.push(`Giới hạn thể lực+${value}`);
                    } else if (attr === 'mpMax') {
                        // Tăng giới hạn pháp lực
                        gameState.variables.mpMax = (gameState.variables.mpMax || 100) + value;
                        effectMessages.push(`Giới hạn pháp lực+${value}`);
                    } else if (gameState.variables.attributes && attr in gameState.variables.attributes) {
                        // Tăng thuộc tính
                        gameState.variables.attributes[attr] = (gameState.variables.attributes[attr] || 0) + value;
                        effectMessages.push(`${getAttributeName(attr)}+${value}`);
                    }
                });

                // Giảm số lượng đan dược
                item.count--;
                if (item.count <= 0) {
                    gameState.variables.items.splice(itemIndex, 1);
                }

                // 🆕 Ghi lại việc dùng đan dược vào cache (cộng dồn số lượng)
                if (!gameState.pendingActions.pills[item.name]) {
                    gameState.pendingActions.pills[item.name] = 0;
                }
                gameState.pendingActions.pills[item.name]++;

                // Cập nhật UI
                updateStatusPanel();

                // Lưu trạng thái game
                saveGameHistory().catch(err => console.error('Lưu thất bại:', err));

                // Hiển thị thông báo hiệu quả
                alert(`Sử dụng ${item.name} thành công!\n${effectMessages.join('\n')}`);
            } else {
                alert('Đan dược này không có hiệu quả');
            }
        }
