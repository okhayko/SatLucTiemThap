        // Xử lý việc chọn tin nhắn (tự động chọn tất cả tin nhắn sau đó) - Giữ lại trong game.html
        function handleMessageCheck(messageDiv) {
            const checkbox = messageDiv.querySelector('.message-checkbox');
            const allMessages = Array.from(document.querySelectorAll('.message'));
            const currentIndex = allMessages.indexOf(messageDiv);

            if (checkbox.checked) {
                // Chọn tin nhắn hiện tại, tự động chọn tất cả tin nhắn sau đó
                for (let i = currentIndex; i < allMessages.length; i++) {
                    const msg = allMessages[i];
                    const cb = msg.querySelector('.message-checkbox');
                    if (cb) {
                        cb.checked = true;
                        msg.classList.add('selected-for-delete');
                    }
                }
            } else {
                // Bỏ chọn tin nhắn hiện tại, tự động bỏ chọn tất cả tin nhắn trước đó
                for (let i = 0; i <= currentIndex; i++) {
                    const msg = allMessages[i];
                    const cb = msg.querySelector('.message-checkbox');
                    if (cb) {
                        cb.checked = false;
                        msg.classList.remove('selected-for-delete');
                    }
                }
            }
        }

        // 🎯 Hàm thống nhất để xây dựng prompt tăng cường
        function buildEnhancedPrompt(userMessage, options = {}) {
            // Lấy cấu hình
            const saved = localStorage.getItem('gameConfig');
            const config = saved ? JSON.parse(saved) : {};

            // 🆕 Đánh dấu rõ ràng đây là yêu cầu của người dùng
            let enhancedPrompt = `【Tình tiết tiếp theo】${userMessage}`;

            // 🆕 0. Thêm prompt dựa trên cài đặt ngôi kể
            const narrativePerspective = config.narrativePerspective || 'first';
            const perspectiveHints = {
                'first': '[Sử dụng ngôi thứ nhất "Tôi"]',
                'second': '[Sử dụng ngôi thứ hai "Bạn"]',
                'third': '[Sử dụng ngôi thứ ba "Anh ấy/Cô ấy"]'
            };
            if (perspectiveHints[narrativePerspective]) {
                enhancedPrompt += `\n\n${perspectiveHints[narrativePerspective]}`;
            }

            // 1. Thêm prompt dựa trên giá trị cơ duyên và thiên khiển
            if (gameState.variables.karmaFortune >= 80) {
                enhancedPrompt += '\n\n[Cơ duyên cao→Cốt truyện tốt]';
            } else if (gameState.variables.karmaPunishment >= 80) {
                enhancedPrompt += '\n\n[Thiên khiển cao→Cốt truyện xấu]';
            }

            // 2. Lấy yêu cầu số chữ tối thiểu
            const minWordCount = config.minWordCount || 0;

            // 3. Nếu là chế độ tùy chọn, thêm kết quả phán định thuộc tính
            if (options.attributeCheck) {
                const { requirement, checkResult } = options.attributeCheck;
                if (requirement.hasRequirement) {
                    if (checkResult.met) {
                        enhancedPrompt += `\n\n[Phán định qua: ${checkResult.attributeName}${checkResult.currentValue}${requirement.operator}${checkResult.requiredValue}→Cốt truyện thành công]`;
                    } else {
                        enhancedPrompt += `\n\n[Phán định thất bại: ${checkResult.attributeName}${checkResult.currentValue}không đủ${checkResult.requiredValue}→Cốt truyện thất bại]`;
                    }
                }
            }

            // 4. Bắt buộc yêu cầu cập nhật biến và tạo tùy chọn
            enhancedPrompt += '\n\n[Bắt buộc trả về 4 tùy chọn (bao gồm phán định thuộc tính), thứ tự: 1. Đối thoại 2. Rời đi 3. Hành động 4. R18]';

            // 5. Thêm yêu cầu số chữ tối thiểu
            if (minWordCount > 0) {
                enhancedPrompt += `\n\n[story≥${minWordCount} chữ]`;
            }

            // 6. Yêu cầu miêu tả cảnh làm tình
            enhancedPrompt += '\n\n[Cấm thần thánh hóa nhân vật chính hoặc xuất hiện cốt truyện tuyệt vọng.]';

            // 8. Nhắc nhở về mối quan hệ (định dạng v3.1)
            enhancedPrompt += '\n\n';

            // 9. Giải thích cập nhật biến (định dạng v3.1)
            enhancedPrompt += '\n\n';

            // 10. Yêu cầu về nhật ký lịch sử
            enhancedPrompt += '\n\n[history trả về 1 mục ≥40 chữ.]';

            // 12. Nhắc nhở cấp độ luyện đan luyện khí
            const alchemyLevel = gameState.variables.alchemyLevel || "Chưa nhập môn";
            const craftingLevel = gameState.variables.craftingLevel || "Chưa nhập môn";

            // Nhắc nhở cấp độ luyện đan
            if (alchemyLevel !== "Chưa nhập môn") {
                enhancedPrompt += `\n\n[Cấp độ luyện đan hiện tại: ${alchemyLevel}, dựa vào cấp độ để phán định tỷ lệ thành công và phẩm chất đan dược]`;
            }

            // Nhắc nhở cấp độ luyện khí
            if (craftingLevel !== "Chưa nhập môn") {
                enhancedPrompt += `\n\n[Cấp độ luyện khí hiện tại: ${craftingLevel}, dựa vào cấp độ để phán định tỷ lệ thành công và phẩm chất trang bị đặc biệt]`;
            }

            // 13. Thêm tóm tắt thao tác cục bộ (nếu có)
            const hasLocalOps = gameState.localOps && (
                (gameState.localOps.items && gameState.localOps.items.length > 0) ||
                (gameState.localOps.attrs && gameState.localOps.attrs.length > 0) ||
                (gameState.localOps.equip && gameState.localOps.equip.length > 0)
            );

            if (hasLocalOps) {
                const localOpsSummary = {
                    items: gameState.localOps.items || [],
                    attrs: gameState.localOps.attrs || [],
                    equip: gameState.localOps.equip || []
                };
                enhancedPrompt += '\n\n[Lịch sử thao tác cục bộ]' + JSON.stringify(localOpsSummary);
            }

            return enhancedPrompt;
        }

        // Gửi input tùy chỉnh của người dùng
        async function sendUserInput() {
            const inputBox = document.getElementById('userInput');
            let userText = inputBox.value.trim();

            if (!userText) {
                alert('Vui lòng nhập nội dung!');
                return;
            }

            if (gameState.isProcessing) return;

            if (!gameState.isGameStarted) {
                alert('Vui lòng tạo nhân vật và bắt đầu trò chơi trước!');
                return;
            }

            // 🆕 Tự động đính kèm cache thao tác
            const actionsSummary = getPendingActionsSummary();
            if (actionsSummary) {
                userText = actionsSummary + userText;
            }

            // 🆕 Hiển thị toàn bộ input của người dùng trên console
            console.log('📤 [Input người dùng]', userText);

            // Làm trống ô nhập
            inputBox.value = '';

            gameState.isProcessing = true;

            // Hiển thị tin nhắn người dùng
            displayUserMessage(userText);

            // Thêm vào lịch sử
            gameState.conversationHistory.push({
                role: 'user',
                content: userText
            });

            // Lưu snapshot biến hiện tại (tin nhắn người dùng)
            gameState.variableSnapshots.push(JSON.parse(JSON.stringify(gameState.variables)));

            // 🆕 Làm trống cache thao tác
            clearPendingActions();

            // Lưu lịch sử game
            saveGameHistory().catch(err => console.error('Lỗi khi lưu lịch sử:', err));

            // Hiển thị thông báo đang tải
            const historyDiv = document.getElementById('gameHistory');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai-message';
            loadingDiv.innerHTML = '<div class="message-content"><span class="loading"></span> AI đang suy nghĩ...</div>';
            loadingDiv.id = 'loading-message';
            historyDiv.appendChild(loadingDiv);
            historyDiv.scrollTop = historyDiv.scrollHeight;

            try {
                // 🎭 Phân tích input người dùng (nếu được bật)
                let userProfileEnhancement = '';
                if (window.userProfileAnalyzer && window.userProfileAnalyzer.isEnabled()) {
                    console.log('[🎭Họa đồ người dùng] Đang phân tích ý định của người dùng...');

                    const loadingEl = document.getElementById('loading-message');
                    if (loadingEl) {
                        loadingEl.innerHTML = '<div class="message-content"><span class="loading"></span> Đang phân tích ý định của người dùng...</div>';
                    }

                    try {
                        const gameContext = {
                            currentLocation: gameState.variables.location || 'Chưa rõ',
                            currentScene: gameState.conversationHistory.slice(-2).map(h => h.content?.substring(0, 200)).join('\n'),
                            characterName: gameState.variables.name || 'Chưa rõ',
                            realm: gameState.variables.realm || 'Nhà mạo hiểm'
                        };

                        const analysisResult = await window.userProfileAnalyzer.analyze(userText, gameContext);

                        if (analysisResult) {
                            userProfileEnhancement = window.userProfileAnalyzer.getEnhancedPrompt(analysisResult);
                            console.log('[🎭Họa đồ người dùng] Phân tích hoàn tất, đã tạo prompt tăng cường');
                        }
                    } catch (analysisError) {
                        console.warn('[🎭Họa đồ người dùng] Phân tích thất bại, sẽ sử dụng input gốc:', analysisError);
                    }

                    if (loadingEl) {
                        loadingEl.innerHTML = '<div class="message-content"><span class="loading"></span> AI đang suy nghĩ...</div>';
                    }
                }

                // 🎯 Dùng hàm thống nhất để tạo prompt tăng cường
                let enhancedInput = buildEnhancedPrompt(userText);

                // 🎭 Nếu có prompt tăng cường từ họa đồ người dùng, thêm vào
                if (userProfileEnhancement) {
                    enhancedInput = userProfileEnhancement + '\n\n---\n\n' + enhancedInput;
                }

                // 🆕 Hiển thị prompt tăng cường hoàn chỉnh trên console
                if (userProfileEnhancement) {
                    console.log('🎭 [Tăng cường bằng Họa đồ người dùng]', userProfileEnhancement);
                }
                console.log('🤖 [Prompt hoàn chỉnh gửi cho AI]', enhancedInput);

                // 🔧 Truyền prompt tăng cường hoàn chỉnh để dùng cho tra cứu vector (Gồm tăng cường họa đồ người dùng + prompt xây dựng thống nhất)
                const response = await callAI(enhancedInput, false, enhancedInput);

                // Xóa thông báo tải
                const loading = document.getElementById('loading-message');
                if (loading) loading.remove();

                handleAIResponse(response);

                // Kích hoạt tạo thế giới động (Bất đồng bộ, không cản trở luồng chính)
                generateDynamicWorld().catch(err => console.error('[Thế giới động] Lỗi khi tạo:', err));

            } catch (error) {
                // Xóa thông báo tải
                const loading = document.getElementById('loading-message');
                if (loading) loading.remove();

                // ❌ Không được xóa tin nhắn người dùng! Hiển thị lỗi và nút thử lại
                displayErrorMessageWithRetry('Phản hồi AI thất bại: ' + error.message, async () => {
                    // Xóa thông báo lỗi
                    const errorDiv = document.getElementById('error-message-with-retry');
                    if (errorDiv) errorDiv.remove();

                    // Tạo lại câu trả lời
                    await regenerateLastResponse();
                });
            }

            gameState.isProcessing = false;
        }

        // Chọn tùy chọn
        async function selectOption(option) {
            // Đảm bảo option là chuỗi
            const optionText = typeof option === 'string' ? option : String(option);

            if (gameState.isProcessing) return;

            // 🔧 Xử lý tùy chọn đặc biệt sau khi phân tích JSON thất bại
            if (option === "Tạo lại câu trả lời") {
                await regenerateLastResponse();
                return;
            }

            if (option === "Bỏ qua lượt này") {
                // Bỏ qua lượt này, tiến thẳng vào lượt tiếp theo
                gameState.isProcessing = false;

                // Xóa thông báo lỗi cuối cùng
                const errorMessage = document.getElementById('error-message-with-retry');
                if (errorMessage) errorMessage.remove();

                // Hiển thị thông báo bỏ qua
                displayAIMessage("Bạn chọn bỏ qua lượt này, câu chuyện tiếp tục...", ["Tiếp tục khám phá"], {
                    situation: 'Người chơi chọn bỏ qua lượt bị lỗi phân tích',
                    playerChoice: 'Bỏ qua lượt này',
                    logicChain: ['Bỏ qua lượt hiện tại', 'Tiếp tục diễn biến câu chuyện'],
                    outcome: 'Câu chuyện tiếp tục, nhưng có thể thiếu một vài chi tiết'
                });
                return;
            }

            if (option === "Xem phản hồi gốc") {
                // Hiển thị phản hồi gốc trong cửa sổ mới
                const historyDiv = document.getElementById('gameHistory');
                const lastAIMessage = historyDiv.querySelector('.ai-message:last-of-type');

                if (lastAIMessage && lastAIMessage.originalResponse) {
                    const newWindow = window.open('', '_blank', 'width=800,height=600,scrollbars=yes');
                    newWindow.document.write(`
                        <html>
                        <head><title>Phản hồi AI gốc</title></head>
                        <body style="font-family: monospace; padding: 20px; white-space: pre-wrap;">
                            <h2>Nội dung phản hồi AI gốc</h2>
                            <hr>
                            <pre>${lastAIMessage.originalResponse}</pre>
                            <hr>
                            <button onclick="window.close()">Đóng cửa sổ</button>
                        </body>
                        </html>
                    `);
                } else {
                    alert('Không tìm thấy nội dung phản hồi gốc');
                }
                return;
            }

            gameState.isProcessing = true;

            // 🆕 Tự động đính kèm cache thao tác
            const actionsSummary = getPendingActionsSummary();
            let finalOption = optionText;
            if (actionsSummary) {
                finalOption = actionsSummary + optionText;
            }

            // 🆕 Hiển thị toàn bộ input của người dùng trên console
            console.log('📤 [Lựa chọn của người dùng]', finalOption);

            // Hiển thị lựa chọn của người dùng (Hiển thị văn bản đầy đủ kèm thao tác đính kèm)
            displayUserMessage(finalOption);

            // Thêm vào lịch sử (Chỉ lưu nội dung tùy chọn)
            gameState.conversationHistory.push({
                role: 'user',
                content: finalOption
            });

            // Lưu snapshot biến hiện tại (Lựa chọn của người dùng)
            gameState.variableSnapshots.push(JSON.parse(JSON.stringify(gameState.variables)));

            // 🆕 Làm trống cache thao tác
            clearPendingActions();

            // Lưu lịch sử game vào IndexedDB
            saveGameHistory().catch(err => console.error('Lỗi khi lưu lịch sử:', err));

            // Hiển thị thông báo đang tải
            const historyDiv = document.getElementById('gameHistory');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai-message';
            loadingDiv.innerHTML = '<div class="message-content"><span class="loading"></span> Đang phân tích ý định của người dùng...</div>';
            loadingDiv.id = 'loading-message';
            historyDiv.appendChild(loadingDiv);
            historyDiv.scrollTop = historyDiv.scrollHeight;

            try {
                // Phân tích yêu cầu thuộc tính và thực hiện phán định (Sử dụng option gốc, không bao gồm tóm tắt thao tác)
                const requirement = parseAttributeRequirement(optionText);
                const checkResult = checkAttributeRequirement(requirement);

                // 🎭 Phân tích Họa đồ người dùng (Đợi phân tích xong, sử dụng prompt tăng cường)
                let analysisEnhancement = '';
                if (window.userProfileAnalyzer && window.userProfileAnalyzer.isEnabled()) {
                    console.log('[🎭Họa đồ người dùng] Tính năng phân tích đã bật, bắt đầu phân tích tùy chọn...');
                    try {
                        const gameContext = {
                            currentLocation: gameState.variables.location || 'Chưa rõ',
                            characterName: gameState.variables.name || 'Chưa rõ',
                            realm: gameState.variables.realm || 'Phàm nhân'
                        };
                        // Đợi phân tích hoàn tất
                        const analysisResult = await window.userProfileAnalyzer.analyzeUserInput(finalOption, gameContext);
                        if (analysisResult) {
                            console.log('[🎭Họa đồ người dùng] Phân tích tùy chọn hoàn tất:', analysisResult);
                            // 🔧 Sửa lỗi: Sử dụng hàm getEnhancedPrompt giống như nhập trực tiếp để tạo prompt tăng cường hoàn chỉnh
                            analysisEnhancement = window.userProfileAnalyzer.getEnhancedPrompt(analysisResult);
                            if (analysisEnhancement) {
                                console.log('[🎭Họa đồ người dùng] Đã tạo prompt tăng cường hoàn chỉnh');
                            }
                        }
                    } catch (analysisErr) {
                        console.warn('[🎭Họa đồ người dùng] Phân tích tùy chọn thất bại:', analysisErr);
                    }
                }

                // Cập nhật thông báo tải
                loadingDiv.innerHTML = '<div class="message-content"><span class="loading"></span> AI đang suy nghĩ...</div>';

                // 🎯 Dùng hàm thống nhất để tạo prompt tăng cường (Truyền vào kết quả phán định thuộc tính)
                let enhancedOption = buildEnhancedPrompt(finalOption, {
                    attributeCheck: { requirement, checkResult }
                });

                // 🎭 Đính kèm kết quả phân tích họa đồ người dùng (Đặt ở đầu, nhất quán với việc nhập trực tiếp)
                if (analysisEnhancement) {
                    enhancedOption = analysisEnhancement + '\n\n---\n\n' + enhancedOption;
                }

                // 🆕 Hiển thị prompt tăng cường hoàn chỉnh trên console
                console.log('📤 [Tùy chọn gốc]', optionText);
                console.log('📤 [Tùy chọn hoàn chỉnh (bao gồm thao tác)]', finalOption);
                console.log('🤖 [Prompt hoàn chỉnh gửi cho AI]', enhancedOption);

                // 🔧 Truyền prompt tăng cường hoàn chỉnh để dùng cho tra cứu vector (Gồm tăng cường họa đồ người dùng + prompt xây dựng thống nhất)
                const response = await callAI(enhancedOption, false, enhancedOption);

                // Xóa thông báo tải
                const loading = document.getElementById('loading-message');
                if (loading) loading.remove();

                handleAIResponse(response);

                // Kích hoạt tạo thế giới động (Bất đồng bộ, không cản trở luồng chính)
                generateDynamicWorld().catch(err => console.error('[Thế giới động] Lỗi khi tạo:', err));

            } catch (error) {
                // Xóa thông báo tải
                const loading = document.getElementById('loading-message');
                if (loading) loading.remove();

                // ❌ Không được xóa tin nhắn người dùng! Hiển thị lỗi và nút thử lại
                displayErrorMessageWithRetry('Phản hồi AI thất bại: ' + error.message, async () => {
                    // Xóa thông báo lỗi
                    const errorDiv = document.getElementById('error-message-with-retry');
                    if (errorDiv) errorDiv.remove();

                    // Tạo lại câu trả lời
                    await regenerateLastResponse();
                });
            }

            gameState.isProcessing = false;
        }

        // Làm cho selectOption có thể truy cập toàn cục
        window.selectOption = selectOption;


        // ==================== Format Game (Định dạng lại) ====================
        // formatGame đã có phiên bản thu gọn trong game-core-systems.js
        // Nhưng ở đây giữ lại phiên bản đầy đủ, bao gồm logic reset trạng thái game
        async function formatGame() {
            if (!confirm('⚠️ Cảnh báo: Việc định dạng lại (format) sẽ xóa toàn bộ file save và tiến độ, bao gồm cả gói dữ liệu DLC, thao tác này không thể khôi phục!\n\n✅ Sẽ giữ lại:\n- Cấu hình API\n- Cài đặt game\n- Cài đặt thế giới động\n\nBạn có chắc chắn muốn format không?')) {
                return;
            }

            console.log('[Format] Bắt đầu format, sẽ giữ lại cấu hình API, cài đặt game và cài đặt thế giới động');

            // Reset trạng thái
            gameState.variables = {
                name: "",
                gender: "",
                realm: "",
                identity: "",
                karmaFortune: 0,
                karmaPunishment: 0,
                cultivationProgress: 0,
                cultivationProgressMax: 100,
                hp: 100,
                hpMax: 100,
                mp: 100,
                mpMax: 100,
                talents: [],
                attributes: {
                    physique: 0,
                    fortune: 0,
                    comprehension: 0,
                    spirit: 0,
                    potential: 0,
                    charisma: 0
                },
                equipment: {
                    head: null,
                    clothes: null,
                    feet: null,
                    treasure1: null,
                    treasure2: null,
                    treasure3: null
                },
                items: [],
                techniques: [],
                spells: [],
                relationships: [],
                location: "",
                history: []
            };
            gameState.previousVariables = null;
            gameState.conversationHistory = [];
            gameState.variableSnapshots = [];
            gameState.isGameStarted = false;
            gameState.isProcessing = false;
            gameState.characterInfo = null;

            // Xóa mọi dữ liệu trong IndexedDB (Bao gồm mọi file save)
            try {
                await clearGameHistory();
            } catch (error) {
                console.error('Xóa dữ liệu thất bại:', error);
            }

            // 【Thêm mới】 Làm trống thư viện vector
            if (window.contextVectorManager) {
                window.contextVectorManager.clear();
                window.contextVectorManager.saveToIndexedDB().catch(err => {
                    console.error('Làm trống thư viện vector thất bại:', err);
                });

                // Làm trống thư viện kiến thức tĩnh
                window.contextVectorManager.clearStaticKB();
                window.contextVectorManager.saveStaticKBToIndexedDB().catch(err => {
                    console.error('Làm trống thư viện kiến thức tĩnh thất bại:', err);
                });
            }

            // Làm trống dữ liệu DLC
            if (window.dlcManager) {
                try {
                    await window.dlcManager.clearAllDLCs();
                    console.log('[Format] Đã xóa sạch toàn bộ dữ liệu DLC');
                } catch (error) {
                    console.error('[Format] Làm trống dữ liệu DLC thất bại:', error);
                }
            }

            // Đã reset dữ liệu thế giới động (đã giữ lại cài đặt enabled và messageInterval)
            gameState.dynamicWorld = {
                enabled: gameState.dynamicWorld?.enabled || false,
                history: [],
                floor: 0,
                isProcessing: false,
                messageInterval: gameState.dynamicWorld?.messageInterval || 1, // Giữ lại cài đặt khoảng thời gian
                messageCounter: 0 // Reset bộ đếm
            };
            console.log('[Format] Đã reset dữ liệu thế giới động (đã giữ lại cài đặt enabled và messageInterval)');

            // Cập nhật tab hiển thị thế giới động
            displayDynamicWorldHistory();

            // Cập nhật panel trạng thái
            updateStatusPanel();

            // Hiển thị menu chính
            showMainMenu();
        }

        // Chuyển đổi tab trên thiết bị di động
        function switchMobileTab(tabName) {
            // Loại bỏ class active
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector('.game-panel').classList.remove('active');
            document.querySelector('.status-panel').classList.remove('active');

            // Thêm class active tương ứng
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            if (tabName === 'game') {
                document.querySelector('.game-panel').classList.add('active');
                // Khi chuyển về panel trò chơi, tự động cuộn xuống cuối tin nhắn
                const scrollToBottom = () => {
                    const historyDiv = document.getElementById('gameHistory');
                    if (historyDiv) {
                        historyDiv.scrollTop = historyDiv.scrollHeight;
                    }
                };
                requestAnimationFrame(scrollToBottom);
                setTimeout(scrollToBottom, 100);
                setTimeout(scrollToBottom, 300);
            } else if (tabName === 'status') {
                document.querySelector('.status-panel').classList.add('active');
            }
        }

        // Bật/tắt Mở rộng/Thu gọn chi tiết mối quan hệ
        function toggleRelationshipDetails(index) {
            console.log('Toggle called for index:', index); // Log gỡ lỗi
            const detailsDiv = document.getElementById(`relationship-details-${index}`);
            console.log('Found details div:', detailsDiv); // Log gỡ lỗi

            if (!detailsDiv) {
                console.error('Details div not found for index:', index);
                return;
            }

            const cardDiv = detailsDiv.parentElement;
            console.log('Current classes - details:', detailsDiv.className, 'card:', cardDiv.className); // Log gỡ lỗi

            if (detailsDiv.classList.contains('show')) {
                // Thu gọn
                detailsDiv.classList.remove('show');
                cardDiv.classList.remove('expanded');
                console.log('Collapsed'); // Log gỡ lỗi
            } else {
                // Mở rộng
                detailsDiv.classList.add('show');
                cardDiv.classList.add('expanded');
                console.log('Expanded'); // Log gỡ lỗi
            }
        }


    </script>

    <script>
        // Điều khiển popup điện thoại
        function toggleMobilePopup() {
            const overlay = document.getElementById('mobilePopupOverlay');
            if (overlay.classList.contains('show')) {
                closeMobilePopup(null, true);
            } else {
                openMobilePopup();
            }
        }

        function openMobilePopup() {
            const overlay = document.getElementById('mobilePopupOverlay');
            overlay.style.display = 'flex';
            // Kích hoạt vẽ lại (reflow) để bật hiệu ứng chuyển cảnh
            overlay.offsetHeight;
            overlay.classList.add('show');
        }

        function closeMobilePopup(event, forceClose = false) {
            // Nếu click vào chính lớp phủ, hoặc bắt buộc đóng
            if (forceClose || (event && event.target.id === 'mobilePopupOverlay')) {
                const overlay = document.getElementById('mobilePopupOverlay');
                overlay.classList.remove('show');
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 300);
            }
        }

        // Phím ESC đóng popup
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeMobilePopup(null, true);
            }
        });
    </script>
