<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberLink Mobile</title>

    <script>
        (function () {
            const GAME_PREFIX = 'game_';

            const originalLocalStorage = {
                getItem: localStorage.getItem.bind(localStorage),
                setItem: localStorage.setItem.bind(localStorage),
                removeItem: localStorage.removeItem.bind(localStorage)
            };

            Storage.prototype.getItem = function (key) {
                return originalLocalStorage.getItem(GAME_PREFIX + key);
            };

            Storage.prototype.setItem = function (key, value) {
                return originalLocalStorage.setItem(GAME_PREFIX + key, value);
            };

            Storage.prototype.removeItem = function (key) {
                return originalLocalStorage.removeItem(GAME_PREFIX + key);
            };

            console.log('[Điện thoại] Đã bật cách ly dữ liệu - Tiền tố localStorage:', GAME_PREFIX);
        })();
    </script>

    <style>
        :root {
            --primary: #00f3ff;
            /* Neon Cyan */
            --primary-glow: rgba(0, 243, 255, 0.5);
            --secondary: #ff003c;
            /* Cyber Red/Pink */
            --bg-dark: #050505;
            --frame-border: #1a1a1a;
            --island-bg: #000;
            --text-main: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            /* Chiều cao viewport động trên mobile, tránh lỗi thanh địa chỉ */
            font-family: 'Courier New', 'Consolas', 'Monaco', monospace;
            overflow: hidden;
            color: var(--text-main);
            background: var(--bg-dark);
        }

        .clock-widget {
            text-align: center;
        }

        /* Hiệu ứng Scanline từ index.html */


        /* Khung điện thoại - Chỉnh sửa responsive */
        .phone-frame {
            width: 100%;
            max-width: 400px;
            height: auto;
            aspect-ratio: 9/18.5;
            background: #000;
            border-radius: 50px;
            border: 4px solid #333;
            box-shadow:
                0 0 0 2px rgba(0, 243, 255, 0.1),
                0 0 50px rgba(0, 243, 255, 0.1),
                0 20px 50px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin: auto;
            z-index: 10;
            /* Đảm bảo nằm trên scanline của body nếu cần, nhưng để bên trong trông đẹp hơn */
        }

        /* Hiển thị toàn màn hình trên thiết bị di động thật, loại bỏ khung giả lập */
        @media screen and (max-width: 480px) and (hover: none) and (pointer: coarse) {
            body {
                align-items: stretch;
            }

            .phone-frame {
                max-width: 100%;
                height: 100vh;
                height: 100dvh;
                aspect-ratio: unset;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }

            .dynamic-island-container {
                top: 8px;
            }

            .status-bar {
                padding-top: 12px;
            }
        }

        /* Thích ứng khu vực an toàn (Màn hình tai thỏ iPhone v.v.) */
        @supports (padding-top: env(safe-area-inset-top)) {
            @media screen and (max-width: 480px) {
                .status-bar {
                    padding-top: calc(env(safe-area-inset-top, 12px) + 6px);
                }

                .dynamic-island-container {
                    top: calc(env(safe-area-inset-top, 8px) + 4px);
                }

                .home-bar {
                    margin-bottom: calc(env(safe-area-inset-bottom, 15px) + 10px);
                }

                .view {
                    padding-bottom: calc(env(safe-area-inset-bottom, 40px) + 20px);
                }

                .app-view {
                    padding-bottom: calc(env(safe-area-inset-bottom, 80px) + 40px);
                }
            }
        }

        /* Nền màn hình */
        .screen-bg {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(0, 243, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.02) 1px, transparent 1px),
                radial-gradient(circle at 50% 30%, #1a1a2e 0%, #000 90%);
            background-size: 20px 20px, 20px 20px, 100% 100%;
            z-index: 0;
        }

        /* Đường quét (scanline) bên trong điện thoại */
        .scanline {
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 243, 255, 0.02) 50%);
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
        }

        /* Dynamic Island */
        .dynamic-island-container {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 30%;
            height: 4%;
            min-height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dynamic-island {
            width: 100%;
            height: 100%;
            background: var(--island-bg);
            border-radius: 20px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            /* Căn camera sang phải */
            padding-right: 12px;
        }

        /* Đèn nhịp thở của camera */
        .camera-dot {
            width: 6px;
            height: 6px;
            background: #0f0;
            border-radius: 50%;
            box-shadow: 0 0 4px #0f0;
            animation: cameraBlink 4s infinite;
            opacity: 0.3;
        }

        @keyframes cameraBlink {

            0%,
            90%,
            100% {
                opacity: 0.3;
                box-shadow: 0 0 0 #0f0;
            }

            92%,
            98% {
                opacity: 1;
                box-shadow: 0 0 8px #0f0;
            }

            95% {
                opacity: 0.3;
            }
        }

        /* Thanh trạng thái */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 18px 30px 0 30px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            z-index: 90;
            position: relative;
        }

        /* Container nội dung màn hình - Dùng để chuyển đổi giao diện */
        .screen-content {
            flex: 1;
            position: relative;
            z-index: 10;
            overflow: hidden;
            /* Cắt nội dung */
        }

        .view {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            padding: 80px 24px 40px 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Giao diện trang chủ */
        .home-view {
            z-index: 1;
            transform: scale(1);
            opacity: 1;
        }

        .home-view.hidden {
            transform: scale(0.9);
            opacity: 0;
            pointer-events: none;
        }

        /* Giao diện App - Che kín toàn màn hình phone-frame */
        .app-view {
            position: absolute;
            inset: 0;
            z-index: 50;
            /* Thấp hơn status-bar và home-bar */
            background: rgba(0, 0, 0, 0.95);

            transform: translateY(100%);
            opacity: 0;
            padding: 60px 24px 80px 24px;
            /* Chừa không gian cho thanh trạng thái ở trên và thanh Home ở dưới */
            display: flex;
            flex-direction: column;
        }

        .app-view.active {
            transform: translateY(0);
            opacity: 1;
        }

        .app-header {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            width: 32px;
            height: 32px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: var(--primary);
            transition: all 0.2s;
        }

        .back-btn:hover {}

        .app-body::-webkit-scrollbar {
            width: 4px;
        }

        .app-body::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        .app-body {
            overflow-y: auto;
        }

        .clock-time {
            font-size: 64px;
            color: #fff;
            font-weight: 200;
            text-shadow: 0 0 20px var(--primary);
            letter-spacing: -2px;
        }

        .clock-date {
            color: var(--primary);
            letter-spacing: 4px;
            font-size: 14px;
            text-transform: uppercase;
        }

        /* Lưới APP */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: auto;
            /* Đẩy xuống dưới cùng */
            padding-bottom: 20px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .app-item:hover {
            transform: translateY(-5px);
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .app-icon::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 100%);
        }

        /* Style icon đặc biệt */
        .icon-msg {
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .icon-forum {
            color: #bf00ff;
            border-color: #bf00ff;
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.2);
        }

        .icon-rel {
            color: var(--secondary);
            border-color: var(--secondary);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.2);
        }

        .icon-asset {
            color: #ffd700;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .app-name {
            color: #ccc;
            font-size: 12px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* Thanh Home dưới cùng */
        .home-bar {
            width: 35%;
            height: 5px;
            background: #fff;
            border-radius: 10px;
            margin: 0 auto 15px auto;
            opacity: 0.5;
            z-index: 100;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .home-bar:active {
            opacity: 1;
            transform: scaleX(0.9);
        }

        /* HUD trang trí */
        .hud-lines {
            position: absolute;
            top: 100px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-end;
            opacity: 0.5;
        }

        .hud-line {
            height: 2px;
            background: var(--primary);
            width: 20px;
        }

        .hud-line:nth-child(2) {
            width: 40px;
            opacity: 0.6;
        }

        .hud-line:nth-child(3) {
            width: 10px;
            opacity: 0.3;
        }
    </style>

    <script src="apps/communication.js"></script>
    <script src="apps/forum.js"></script>
    <script src="apps/relationship.js"></script>
    <script src="apps/assets.js"></script>
</head>

<body>
    <div class="phone-frame">
        <div class="screen-bg"></div>
        <div class="scanline"></div>

        <div class="status-bar">
            <span id="clock-small">12:42</span>
            <div class="status-icons">
                <span>5G</span>
                <span style="margin-left: 5px">100%</span>
            </div>
        </div>

        <div class="dynamic-island-container">
            <div class="dynamic-island" id="dynamicIsland">
                <div class="camera-dot"></div>
            </div>
        </div>

        <div class="hud-lines">
            <div class="hud-line"></div>
            <div class="hud-line"></div>
            <div class="hud-line"></div>
        </div>

        <div class="screen-content">
            <div class="view home-view" id="homeView">
                <div class="clock-widget">
                    <div class="clock-time" id="clock-big">12:42</div>
                    <div class="clock-date">CYBER YEAR 2077</div>
                </div>

                <div class="app-grid">
                    <div class="app-item" onclick="openApp('msg', 'Nhắn tin')">
                        <div class="app-icon icon-msg">💬</div>
                        <span class="app-name">Nhắn tin</span>
                    </div>
                    <div class="app-item" onclick="openApp('forum', 'Diễn đàn')">
                        <div class="app-icon icon-forum">🌐</div>
                        <span class="app-name">Diễn đàn</span>
                    </div>
                    <div class="app-item" onclick="openApp('rel', 'Quan hệ')">
                        <div class="app-icon icon-rel">👥</div>
                        <span class="app-name">Quan hệ</span>
                    </div>
                    <div class="app-item" onclick="openApp('asset', 'Tài sản')">
                        <div class="app-icon icon-asset">💰</div>
                        <span class="app-name">Tài sản</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="app-view" id="appView">
            <div class="app-header">
                <div class="back-btn" onclick="goHome()">←</div>
                <span id="appTitle">Tên ứng dụng</span>
            </div>
            <div class="app-body" id="appContent">
                </div>
        </div>

        <div class="home-bar" onclick="goHome()"></div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const timeStr = `${hours}:${minutes}`;
            document.getElementById('clock-small').textContent = timeStr;
            document.getElementById('clock-big').textContent = timeStr;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Tương tác Dynamic Island
        const island = document.getElementById('dynamicIsland');
        island.addEventListener('click', () => {
            if (island.style.width === '200px') return;

            island.style.width = '200px';
            island.style.height = '60px';
            // Mô phỏng hiển thị thông báo
            const originalContent = island.innerHTML;
            island.innerHTML = '<span style="color:#fff; font-size:12px; margin-left:20px;">System Normal</span>' + originalContent;

            setTimeout(() => {
                island.style.width = '100%';
                island.style.height = '100%';
                island.innerHTML = originalContent; // Khôi phục trạng thái ban đầu
            }, 2000);
        });

        // Logic điều hướng App
        const homeView = document.getElementById('homeView');
        const appView = document.getElementById('appView');
        const appTitle = document.getElementById('appTitle');
        const appContent = document.getElementById('appContent');

        // Map module App
        const appModules = {
            'msg': { name: 'Nhắn tin', content: communicationApp },
            'forum': { name: 'Diễn đàn', content: forumApp },
            'rel': { name: 'Quan hệ', content: relationshipApp },
            'asset': { name: 'Tài sản', content: assetsApp }
        };

        // Tải nội dung App
        function openApp(id, name) {
            homeView.classList.add('hidden');
            appView.classList.add('active');
            appTitle.textContent = name;

            const module = appModules[id];
            if (module) {
                appContent.innerHTML = module.content;

                // App Nhắn tin cần khởi tạo và render danh sách liên hệ
                if (id === 'msg' && window.commApi && window.commApi.initApp) {
                    window.commApi.initApp();
                }

                // App Diễn đàn cần khởi tạo và tải danh sách bài viết
                if (id === 'forum' && window.forumApi && window.forumApi.initApp) {
                    window.forumApi.initApp();
                }
            } else {
                appContent.innerHTML = `
                    <div style="text-align:center; padding:40px; color:#ff003c;">
                        <div style="font-size:48px; margin-bottom:15px;">⚠️</div>
                        <div style="font-size:14px;">App không tồn tại</div>
                    </div>
                `;
            }
        }

        function goHome() {
            homeView.classList.remove('hidden');
            appView.classList.remove('active');
        }
    </script>

    <script src="mobile-prompts.js"></script>
</body>

</html>
